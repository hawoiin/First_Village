<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ほのぼの生活シム（仮）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --sky1:#BEE7F5; --sky2:#E8F6E0;
    --cream:#FFF8EA; --wood:#B9845; --wood-d:#8C6230;
    --ink:#4A3A2A; --leaf:#6FAE5C; --leaf-d:#4E8B3E;
    --accent:#FF9F6B; --accent-2:#FFC96B; --water:#8FD3E8; --pink:#FFB4C6;
    --panel:#FFF8EA; --shadow:rgba(90,70,40,.25);
    --title-color:#8C6230; --title-shadow:#fff; --sub-color:#7a9c68;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(180deg, var(--sky1), var(--sky2));
    font-family:'Noto Sans JP',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:18px 12px 40px;
  }
  h1,h2,h3,.disp{font-family:'Zen Maru Gothic',sans-serif;}
  .wrap{width:100%;max-width:620px;}

  .title-row{text-align:center;margin-bottom:10px;}
  .title-row h1{font-size:26px;color:var(--title-color);margin:0;text-shadow:2px 2px 0 var(--title-shadow);transition:color .6s ease,text-shadow .6s ease;}
  .title-row .sub{font-size:11px;letter-spacing:2px;color:var(--sub-color);font-weight:700;transition:color .6s ease;}

  .panel{
    background:var(--panel);
    border:4px solid #fff;
    border-radius:22px;
    box-shadow:0 10px 0 var(--shadow), 0 14px 24px rgba(90,70,40,.18);
    padding:18px;
    margin-bottom:14px;
  }

  /* ---------- Start screen ---------- */
  .start-field{margin-bottom:14px;}
  .start-field label{display:block;font-size:12.5px;font-weight:700;color:var(--wood-d);margin-bottom:6px;}
  .start-field input{
    width:100%;padding:10px 12px;border-radius:12px;border:2px solid #e6d9bd;
    font-family:'Noto Sans JP';font-size:14px;background:#fffef9;
  }
  .avatar-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .avatar-btn{
    width:46px;height:46px;border-radius:50%;border:3px solid #e6d9bd;background:#fffef9;
    font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .avatar-btn.active{border-color:var(--accent);background:#FFEFE0;}
  .btn{
    font-family:'Zen Maru Gothic';font-weight:900;font-size:14.5px;
    background:var(--accent);color:#fff;border:none;border-radius:999px;
    padding:12px 26px;cursor:pointer;box-shadow:0 5px 0 #E07E4A;
    transition:transform .08s ease;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #E07E4A;}
  .btn.secondary{background:#8FBF7F;box-shadow:0 5px 0 #5F9450;}
  .btn.blue{background:#6FB6D9;box-shadow:0 5px 0 #4A8CAE;}
  .btn:disabled{opacity:.4;cursor:default;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}

  /* ---------- Game HUD ---------- */
  .hud-top{display:flex;justify-content:flex-start;align-items:center;margin-bottom:8px;flex-wrap:nowrap;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
  .hud-chip{
    background:#fff;border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700;
    box-shadow:0 3px 0 rgba(90,70,40,.15);color:var(--wood-d);
    flex-shrink:0;white-space:nowrap;
  }
  .hud-chip.bgm-chip{
    max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .light-gauge-wrap{
    display:flex;align-items:center;gap:8px;background:#2b2038;border-radius:999px;
    padding:6px 14px;margin-bottom:8px;box-shadow:0 3px 0 rgba(0,0,0,.2);
  }
  .light-gauge-label{font-size:12px;font-weight:900;color:#FFD23F;white-space:nowrap;}
  .light-gauge-track{flex:1;height:10px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden;}
  .light-gauge-fill{height:100%;background:linear-gradient(90deg,#FFD23F,#FF9F6B);border-radius:999px;transition:width .2s linear;}
  .light-gauge-fill.flicker{animation:paleFlicker .9s ease;}
  @keyframes paleFlicker{
    0%{background:linear-gradient(90deg,#FFD23F,#FF9F6B);}
    30%{background:#F2EFE7;}
    60%{background:#EDEAE3;}
    100%{background:linear-gradient(90deg,#FFD23F,#FF9F6B);}
  }
  #devPanel{
    position:fixed; top:10px; right:10px; z-index:9999;
    background:rgba(20,20,26,.92); color:#F2EFE7; border-radius:12px;
    padding:10px 12px; width:210px; font-size:12px;
    box-shadow:0 6px 20px rgba(0,0,0,.4); max-height:90vh; overflow-y:auto;
  }
  .dev-title{font-weight:900; font-size:11px; color:#FFD23F; margin-bottom:6px;}
  .dev-row{display:flex; gap:6px; margin-bottom:6px;}
  .dev-btn{
    flex:1; background:#3A3550; color:#F2EFE7; border:1px solid #55507A; border-radius:8px;
    padding:6px 8px; font-size:11.5px; cursor:pointer; font-family:inherit;
  }
  .dev-btn:hover{background:#4A4568;}
  #canvasWrap3d{
    display:block;border-radius:18px;border:4px solid #fff;
    box-shadow:0 6px 0 var(--shadow);
    background:linear-gradient(180deg,#BEE7F5,#DFF3E4);
    touch-action:none;
    max-width:100%;
    overflow:hidden;
    position:relative;
    line-height:0;
  }
  #canvasWrap3d canvas{ display:block; width:100%; height:auto; cursor:pointer; }
  .tilt-band{
    position:absolute; left:0; right:0; pointer-events:none;
    backdrop-filter:blur(3.5px); -webkit-backdrop-filter:blur(3.5px);
  }
  .tilt-band.top{ top:0; height:22%; background:linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0)); }
  .tilt-band.bottom{ bottom:0; height:26%; background:linear-gradient(0deg, rgba(255,255,255,.35), rgba(255,255,255,0)); }
  .canvas-wrap{position:relative;}
  .prompt-bubble{
    position:absolute;left:50%;top:8px;transform:translateX(-50%);
    background:#fff;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;
    box-shadow:0 3px 0 rgba(90,70,40,.15);color:var(--wood-d);pointer-events:none;
    display:none;white-space:nowrap;z-index:5;
  }
  .toast-bubble{
    top:44px;background:#2b2038;color:#F2EFE7;white-space:normal;max-width:88%;
    text-align:center;line-height:1.5;z-index:6;border-radius:14px;
  }

  .controls-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;gap:10px;flex-wrap:wrap;}
  .joystick-wrap{width:120px;height:120px;display:flex;align-items:center;justify-content:center;touch-action:none;}
  .joystick-base{
    position:relative;width:112px;height:112px;border-radius:50%;
    background:rgba(255,255,255,.55);border:3px solid rgba(140,98,48,.35);
    box-shadow:inset 0 3px 8px rgba(90,70,40,.18);touch-action:none;user-select:none;
  }
  .joystick-knob{
    position:absolute;width:52px;height:52px;border-radius:50%;
    left:50%;top:50%;transform:translate(-50%,-50%);
    background:#fff;border:3px solid var(--wood-d);
    box-shadow:0 3px 0 rgba(90,70,40,.25);touch-action:none;user-select:none;pointer-events:none;
    transition:box-shadow .15s ease;
  }
  .joystick-base.active .joystick-knob{box-shadow:0 1px 0 rgba(90,70,40,.25);background:#FFF3D6;}
  .right-controls{display:flex;align-items:flex-end;gap:12px;touch-action:none;}
  .run-btn{
    width:56px;height:56px;border-radius:50%;background:#fff;color:var(--wood-d);
    font-family:'Zen Maru Gothic';font-weight:900;font-size:11px;border:3px solid #8FBF7F;cursor:pointer;
    box-shadow:0 4px 0 #cfd9c5;user-select:none;touch-action:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;
  }
  .run-btn.active{background:#8FBF7F;color:#fff;box-shadow:0 4px 0 #5F9450;}
  .run-btn:active{transform:translateY(3px);}
  .action-btn{
    width:74px;height:74px;border-radius:50%;background:var(--accent);color:#fff;
    font-family:'Zen Maru Gothic';font-weight:900;font-size:13px;border:none;cursor:pointer;
    box-shadow:0 5px 0 #E07E4A;user-select:none;touch-action:none;
  }
  .action-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #E07E4A;}

  .inv-strip{display:flex;gap:8px;overflow-x:auto;padding:10px 4px;margin-top:8px;}
  .inv-item{
    flex:0 0 auto;background:#fff;border-radius:12px;padding:6px 10px;text-align:center;
    box-shadow:0 3px 0 rgba(90,70,40,.15);min-width:48px;
  }
  .inv-item .ii-icon{font-size:20px;}
  .inv-item .ii-count{font-size:11px;font-weight:900;color:var(--wood-d);}

  .acquire-log-wrap{
    background:var(--panel); border:3px solid #fff; border-radius:16px;
    padding:10px 14px; margin-top:4px; box-shadow:0 4px 0 rgba(90,70,40,.15);
  }
  .acquire-log-title{font-family:'Zen Maru Gothic';font-weight:900;font-size:12.5px;color:var(--wood-d);margin-bottom:6px;}
  .acquire-log{max-height:130px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;}
  .log-row{font-size:12px;color:#5b4a34;padding:3px 8px;background:#fffef9;border-radius:8px;}
  .log-row:first-child{background:#FFF3D6;font-weight:700;}
  .log-empty{font-size:11.5px;color:#a08f6f;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(60,45,25,.45);
    display:none;align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:var(--panel);border-radius:22px;border:4px solid #fff;
    box-shadow:0 10px 0 var(--shadow);padding:20px;max-width:480px;width:100%;
    max-height:82vh;overflow-y:auto;
  }
  .modal-box h2{margin:0 0 4px;font-size:18px;color:var(--wood-d);}
  .modal-box .mdesc{font-size:12px;color:#8a7a5f;margin-bottom:12px;line-height:1.6;}
  .shop-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:#fffef9;border-radius:12px;padding:8px 12px;margin-bottom:8px;
  }
  .shop-row .sr-left{display:flex;align-items:center;gap:10px;}
  .shop-row .sr-icon{font-size:22px;}
  .shop-row .sr-name{font-size:13px;font-weight:700;}
  .shop-row .sr-price{font-size:11.5px;color:#8a7a5f;}
  .mini-btn{
    font-family:'Zen Maru Gothic';font-weight:900;font-size:12px;
    background:var(--accent-2);color:var(--wood-d);border:none;border-radius:999px;
    padding:7px 14px;cursor:pointer;box-shadow:0 3px 0 #D9A63F;
  }
  .mini-btn:disabled{opacity:.35;cursor:default;}
  .mini-btn.buy{background:#8FBF7F;color:#fff;box-shadow:0 3px 0 #5F9450;}

  .dialogue-face{font-size:40px;text-align:center;margin-bottom:6px;}
  .dialogue-name{text-align:center;font-weight:900;font-family:'Zen Maru Gothic';color:var(--wood-d);margin-bottom:8px;}
  .dialogue-text{
    background:#fffef9;border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.8;
    margin-bottom:12px;min-height:50px;
  }

  .fade-screen{
    position:fixed;inset:0;background:#2b2038;color:#fff;display:none;
    align-items:center;justify-content:center;flex-direction:column;z-index:80;
    font-family:'Zen Maru Gothic';text-align:center;
  }
  .fade-screen.show{display:flex;}
  .fade-screen .fs-big{font-size:22px;font-weight:900;margin-bottom:8px;}
  .fade-screen .fs-sub{font-size:13px;color:#cfc3e0;}

  .footer-note{font-size:11px;color:#8a9c78;text-align:center;margin-top:10px;line-height:1.8;}

  /* ---------- Box art (production reveal) ---------- */
  .boxart{
    max-width:360px;margin:10px auto;padding:20px 18px;border-radius:20px;text-align:center;
    background:linear-gradient(160deg, var(--genre-color, #8C54FF), #22163a 135%);
    border:4px solid rgba(255,255,255,.35);
    box-shadow:0 10px 0 rgba(0,0,0,.2);
    position:relative; overflow:hidden;
  }
  .boxart-obi{
    position:absolute; top:14px; right:-38px; width:150px; text-align:center;
    background:#FF3B5C; color:#fff; font-family:'Zen Maru Gothic'; font-weight:900; font-size:11px;
    padding:4px 0; transform:rotate(40deg); box-shadow:0 2px 4px rgba(0,0,0,.25); letter-spacing:1px;
  }
  .boxart-obi.obi-perfect{
    background:linear-gradient(90deg,#FFD23F,#FF9F6B,#FF4DE1); color:#3a2a12;
  }
  .perfect-combo-banner{
    margin-top:8px;padding:10px 14px;border-radius:12px;
    background:linear-gradient(135deg,rgba(255,210,63,.28),rgba(255,77,225,.22));
    border:1px solid rgba(255,210,63,.65);color:#fff;font-size:13.5px;text-align:center;font-weight:700;
  }
  .boxart-code{
    position:absolute; top:8px; left:10px; font-size:9px; color:rgba(255,255,255,.55);
    font-family:monospace; letter-spacing:.5px;
  }
  .boxart-emoji{font-size:38px;margin-bottom:6px;}
  .boxart-title{font-family:'Zen Maru Gothic';font-weight:900;font-size:22px;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.3);}
  .boxart-tagline{font-size:13.5px;color:#FFE8B0;font-weight:700;margin-top:4px;}
  .boxart-genre{font-size:13px;color:#F3E6FF;margin-top:4px;letter-spacing:1px;}
  .boxart-stars{font-size:19px;color:#FFD23F;margin-top:8px;letter-spacing:2px;}
  .boxart-scorerow{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px;}
  .critic-score{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'Zen Maru Gothic';font-weight:900;font-size:16px;color:#fff;border:2px solid rgba(255,255,255,.5);}
  .critic-score.good{background:#2ED47A;}
  .critic-score.mid{background:#F2B705;color:#4A3A2A;}
  .critic-score.low{background:#FF3B5C;}
  .boxart-reaction{font-size:13px;color:#F3E6FF;background:rgba(0,0,0,.2);padding:4px 10px;border-radius:999px;}
  .boxart-cast{font-size:12.5px;color:#D8C6F2;margin-top:8px;}
  .boxart-meta-grid{
    display:flex; gap:8px; margin-top:8px; text-align:left;
  }
  .boxart-meta-grid > div{
    flex:1; background:rgba(0,0,0,.16); border-radius:10px; padding:8px 10px;
    font-size:12.5px; color:#F3E6FF; line-height:1.6;
  }
  .boxart-meta-grid span{color:#D8C6F2; font-size:11.5px;}

  /* ---------- Song Composer ---------- */
  .composer-row{display:flex;align-items:center;gap:2px;margin-bottom:2px;}
  .composer-label{width:20px;font-size:10px;color:#8a7a5f;text-align:right;margin-right:4px;flex-shrink:0;}
  .composer-cell{width:21px;height:21px;border-radius:4px;background:#EFE6D0;border:1px solid #ddcf9f;cursor:pointer;flex-shrink:0;padding:0;}
  .composer-cell.active{background:var(--accent);border-color:var(--accent);}
  .composer-cell.drum-cell.active{background:#5A6B8C;border-color:#5A6B8C;}
  .composer-cell.playhead{box-shadow:0 0 0 2px #4A90D9 inset;}
  .composer-controls{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap;font-size:12px;}
  .composer-controls select, .composer-controls input[type=range]{font-family:inherit;}
  .song-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fffef9;border-radius:12px;padding:8px 12px;margin-bottom:8px;}

  .gamble-box{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;}
  .gamble-card{flex:1;min-width:200px;border-radius:16px;padding:14px;border:3px solid rgba(0,0,0,.08);}
  .gamble-card.safe{background:rgba(111,182,217,.15);}
  .gamble-card.risk{background:rgba(255,107,92,.15);}
  .gamble-card h3{margin:0 0 6px;font-size:13.5px;color:var(--wood-d);}
  .gamble-card p{font-size:11.5px;color:#8a7a5f;margin:0 0 10px;line-height:1.6;}
  .result-banner{
    display:inline-flex;align-items:center;gap:6px;font-family:'Zen Maru Gothic';font-weight:900;
    font-size:12.5px;padding:5px 12px;border-radius:999px;margin:6px 0;
  }
  .result-banner.win{background:#2ED47A;color:#08381f;}
  .result-banner.lose{background:#FF3B5C;color:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <div class="title-row">
    <div class="sub">🌿 SLOW LIFE VILLAGE GAME</div>
    <h1>ほのぼの生活シム（仮）</h1>
  </div>
  <div id="app"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<div class="fade-screen" id="fadeScreen">
  <div class="fs-big" id="fadeBig">おやすみなさい…</div>
  <div class="fs-sub" id="fadeSub"></div>
</div>

<div id="devPanel" style="display:none;">
  <div class="dev-title">🛠️ 開発者モード <span style="font-weight:400;">(半角 ` キーで開閉)</span></div>
  <div class="dev-row">
    <button class="dev-btn" id="devToNight">🌙 夜にする</button>
    <button class="dev-btn" id="devToDay">☀️ 昼にする</button>
  </div>
  <div class="dev-row">
    <button class="dev-btn" id="devToForest">🌲 森へワープ</button>
    <button class="dev-btn" id="devToVillage">🏠 村へ戻る</button>
  </div>
  <div class="dev-title" style="margin-top:8px;">森の奥イベントを起こす</div>
  <div class="dev-row"><button class="dev-btn" id="devEvFigure">白い子の気配</button></div>
  <div class="dev-row"><button class="dev-btn" id="devEvSound">物音</button></div>
  <div class="dev-row"><button class="dev-btn" id="devEvObject">忘れ物</button></div>
  <div class="dev-row"><button class="dev-btn" id="devEvDisorient">違和感</button></div>
  <div class="dev-row"><button class="dev-btn" id="devEvFlicker">灯りの異常</button></div>
  <div class="dev-row"><button class="dev-btn" id="devEvVillager">村人の目撃（夜限定）</button></div>
</div>


<script>
/* ============================================================
   CONSTANTS & DATA
   ============================================================ */
const TILE = 32, COLS = 18, ROWS = 12;
const SUNFLOWER_TILES = [[15,8],[16,8],[17,8],[15,9],[16,9],[17,9],[15,10],[16,10]];
const CW = TILE*COLS, CH = TILE*ROWS;

const AVATARS = ['😊','🐧','🌸','🍁','🌻','⛄','🎃','👻','🪆','🌝','🌚','🌛','🌞'];
const PLAYER_COLORS = ['#FF7A5C','#FFB238','#3FBF6F','#3FA9E8','#B573F0','#FF5C9E'];

const ITEMS = {
  wood:   {name:'木の枝', icon:'🪵', sell:5,  cat:'material'},
  apple:  {name:'りんご', icon:'🍎', sell:8,  cat:'material'},
  chestnut:{name:'くり',  icon:'🌰', sell:6,  cat:'material'},
  flower: {name:'はな',   icon:'🌸', sell:4,  cat:'material'},
  fossil: {name:'化石',   icon:'🦴', sell:40, cat:'material'},
  gem:    {name:'宝石',   icon:'💎', sell:60, cat:'material'},
  bug_butterfly:{name:'ちょうちょ', icon:'🦋', sell:15, cat:'bug'},
  bug_ladybug:  {name:'てんとう虫', icon:'🐞', sell:10, cat:'bug'},
  bug_bee:      {name:'はち',      icon:'🐝', sell:12, cat:'bug'},
  fish_carp:  {name:'ふな',      icon:'🐟', sell:20, cat:'fish'},
  fish_trop:  {name:'ねったいぎょ',icon:'🐠', sell:45, cat:'fish'},
  fish_shrimp:{name:'えび',      icon:'🦐', sell:15, cat:'fish'},
  fish_junk:  {name:'古靴',      icon:'👢', sell:1,  cat:'fish'},
  mushroom:  {name:'森のキノコ', icon:'🍄', sell:18, cat:'material'},
  glowstone: {name:'輝石',      icon:'💠', sell:55, cat:'material'},
  ancient_wood:{name:'大樹のかけら', icon:'🪵', sell:35, cat:'material'},
  note_page: {name:'白いノートの切れ端', icon:'📄', sell:2, cat:'lore'},
  odd_item: {name:'誰かの忘れ物', icon:'🎐', sell:1, cat:'lore'},
  ancient_relic: {name:'最奥のかけら', icon:'🌌', sell:0, cat:'lore'},
  // furniture / placeables

function freshnessGapFor(genreName){
  const last = G.genreLastProducedAt[genreName];
  if(last==null) return 999; // まだ一度も作っていないジャンルは最大の新鮮さ扱い
  return G.productionCount - last;
}
function freshnessInfoFor(genreName){
  const gap = freshnessGapFor(genreName);
  if(gap>=FRESH_GAP_HIGH) return {tier:'high', discount:FRESH_DISCOUNT_HIGH, salesMul:FRESH_SALES_MUL_HIGH, label:'🌱新鮮！必要能力-'+FRESH_DISCOUNT_HIGH+'／売上+'+Math.round((FRESH_SALES_MUL_HIGH-1)*100)+'%'};

function randPick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function pickNUnique(arr, n){
  const pool = [...arr];
  const out = [];
  while(pool.length && out.length<n){
    const i = Math.floor(Math.random()*pool.length);
    out.push(pool.splice(i,1)[0]);
  }
  return out;
}

function computeStudioStats(squad){
  const bonus = (id, stat)=> (G.villagerStatBonus && G.villagerStatBonus[id] && G.villagerStatBonus[id][stat]) || 0;
  let techSum = squad.reduce((a,c)=>a+c.tech+bonus(c.id,'tech'),0);
  let ideaSum = squad.reduce((a,c)=>a+c.idea+bonus(c.id,'idea'),0);
  let coopSum = squad.reduce((a,c)=>a+c.coop+bonus(c.id,'coop'),0);
  const synergies = detectSynergies(squad);
  synergies.forEach(sp=>{
    if(sp.stat==='tech') techSum += sp.bonus;
    else if(sp.stat==='idea') ideaSum += sp.bonus;
    else coopSum += sp.bonus;
  });
  return {techSum, ideaSum, coopSum, synergies};
}

function generateTitleCandidates(genreName, n){
  const words = GENRE_WORDS[genreName] || GENRE_WORDS['ノベル'];
  const taglineBank = TAGLINES[genreName] || TAGLINES['ノベル'];
  const taglinePool = pickNUnique(taglineBank, n);
  const seen = new Set();
  const out = [];
  let tries = 0;
  while(out.length<n && tries<40){
    tries++;
    const title = randPick(words.adj) + randPick(words.noun);
    if(seen.has(title)) continue;
    seen.add(title);
    out.push({title, tagline: taglinePool[out.length % taglinePool.length]});
  }
  return out;
}

const SEQUEL_SUFFIXES = ['2','II','リターンズ','〜再臨〜','〜そして、もう一度〜','外伝','完結編','〜続きの物語〜'];
function generateSequelTitleCandidates(prevWork, n){
  const genreName = prevWork.genre;
  const taglineBank = TAGLINES[genreName] || TAGLINES['ノベル'];
  const taglinePool = pickNUnique(taglineBank, n);
  const suffixes = [...SEQUEL_SUFFIXES].sort(()=>Math.random()-0.5).slice(0,n);
  return suffixes.map((suf,i)=>({
    title: `${prevWork.title} ${suf}`,
    tagline: taglinePool[i % taglinePool.length],
    isSequel: true,
  }));
}

  const parts = SYNOPSIS_PARTS[genreName] || SYNOPSIS_PARTS['ノベル'];

  const QUALITY_LINKS = ['そんな一作は、', '仕上がってみれば、', '蓋を開けてみると、'];

  const sentences = [
    `主人公は${protagonist}。`,
    `${incident}…そのはずが、${twist}。`,
    `${randPick(QUIRK_LINKS)}${quirk}。`,

function generateVillageWork(project, squad, opts){
  opts = opts || {};
  const style = opts.style || PRODUCTION_STYLES[0];
  const focus = opts.focusAlloc || {tech:0, idea:0, coop:0};

  let {techSum, ideaSum, coopSum, synergies} = computeStudioStats(squad);
  techSum += focus.tech||0; ideaSum += focus.idea||0; coopSum += focus.coop||0;

  const streakBonus = opts.streakBonus||0;
  if(streakBonus){ techSum += streakBonus; ideaSum += streakBonus; coopSum += streakBonus; }

  const discount = opts.fresh ? opts.fresh.discount : 0;
  const techMet = techSum>=Math.max(1,project.tech-discount),
        ideaMet = ideaSum>=Math.max(1,project.idea-discount),
        coopMet = coopSum>=Math.max(1,project.coop-discount);
  const metCount = [techMet, ideaMet, coopMet].filter(Boolean).length;
  let stars = metCount===3?5 : metCount===2?4 : metCount===1?3 : 2;

  if(style.highVariance){
    const roll = Math.random();
    if(roll<0.25) stars = 5;
    else if(roll<0.5) stars = Math.max(1, stars-2);
  }

  let gambleResult = null;
  if(opts.gamble){
    const won = Math.random() < GAMBLE_WIN_CHANCE;
    gambleResult = won ? 'win' : 'lose';
    stars = won ? Math.min(5, stars+1) : Math.max(1, stars-1);
  }

  const title = opts.titleChoice ? opts.titleChoice.title : (randPick(GENRE_WORDS[project.name]||GENRE_WORDS['ノベル'].adj)+randPick((GENRE_WORDS[project.name]||GENRE_WORDS['ノベル']).noun));
  const tagline = opts.titleChoice ? opts.titleChoice.tagline : randPick(TAGLINES[project.name]||TAGLINES['ノベル']);

  let criticScore = stars*17 + Math.floor(Math.random()*10)-4;
  criticScore = Math.round(criticScore * (style.critMul||1));
  if(gambleResult==='win') criticScore += 8;
  if(gambleResult==='lose') criticScore -= 10;
  criticScore = Math.max(30, Math.min(99, criticScore));

  let quoteBank;
  if(stars>=5) quoteBank = QUOTES_MASTER;
  else if(stars<=2) quoteBank = QUOTES_FLOP;
  else {
    const techRatio = project.tech ? (techSum-project.tech)/project.tech : 0;
    const ideaRatio = project.idea ? (ideaSum-project.idea)/project.idea : 0;
    const coopRatio = project.coop ? (coopSum-project.coop)/project.coop : 0;
    if(techRatio>=ideaRatio && techRatio>=coopRatio) quoteBank = QUOTES_TECH;
    else if(ideaRatio>=techRatio && ideaRatio>=coopRatio) quoteBank = QUOTES_IDEA;
    else quoteBank = QUOTES_COOP;
  }
  const quote = randPick(quoteBank);

  let reactionTier = stars>=5 ? 'high' : stars<=2 ? 'low' : 'mid';
  if(style.softenReaction && reactionTier==='low') reactionTier = 'mid';
  const reactionBank = reactionTier==='high'?REACTIONS_HIGH : reactionTier==='low'?REACTIONS_LOW : REACTIONS_MID;
  const reaction = randPick(reactionBank);

  const synopsis = buildVillageSynopsis(project.name, squad, stars, opts.quirkChoice);
  const roleEmojis = [...new Set(squad.map(c=>c.roleEmoji))];
  const emojiCombo = [project.emoji, ...roleEmojis].slice(0,4).join(' ');

  let sales = stars*22 + Math.floor(Math.random()*10);
  sales = Math.round(sales * (style.salesMul||1));
  if(opts.fresh) sales = Math.round(sales * opts.fresh.salesMul);
  if(gambleResult==='win') sales = Math.round(sales*1.6);
  if(gambleResult==='lose') sales = Math.round(sales*0.5);
  sales = Math.max(8, sales);

  const words2 = GENRE_WORDS[project.name] || GENRE_WORDS['ノベル'];
  const themeSong = randPick(words2.adj) + randPick(words2.noun);
  const singer = squad.find(c=>c.role==='声優') || squad.find(c=>c.role==='作曲家');
  const songCredit = singer ? `歌：${singer.name}` : `${project.name}スタジオ・サウンドチーム`;

  const playHours = Math.max(3, 4 + stars*2 + Math.floor(Math.random()*3)-1);
  const catalogCode = `PP-${String(Math.floor(1000+Math.random()*9000))}`;
  const hypeBank = stars>=5 ? HYPE_HIGH : stars<=2 ? HYPE_LOW : null;
  const hypeLabel = hypeBank ? randPick(hypeBank) : null;
  const perfectCombo = stars>=5 ? findPerfectCombo(project.name, style.id) : null;

  return {

    title, tagline, stars, criticScore, quote, reaction, synopsis, emojiCombo,
    genre:project.name, genreColor:project.color, sales, style, gambleResult,

    freshTier: opts.fresh ? opts.fresh.tier : null, streakBonus, synergies: synergies||[],
    isSequel: !!(opts.titleChoice && opts.titleChoice.isSequel),
  };
}

function newGame(playerName, villageName, avatar, playerColor){
  const map = buildMap();

  const buildings = [
    {id:'house', name:'あなたの家', c:7, r:1, w:2, h:2, color:'#FFD9C0', icon:'🏠', doorC:7, doorR:3},
    {id:'shop',  name:'よろず商店', c:13, r:1, w:2, h:2, color:'#C7E8CA', icon:'🏪', doorC:13, doorR:3},

  ];
  buildings.forEach(b=>{
    for(let r=b.r;r<b.r+b.h;r++) for(let c=b.c;c<b.c+b.w;c++) solid.add(c+','+r);
  });

  // reserve door tiles + the tile directly in front of each door so nothing ever blocks entry
  const reserved = new Set();
  buildings.forEach(b=>{
    reserved.add(b.doorC+','+b.doorR);
    reserved.add(b.doorC+','+(b.doorR+1));
  });

  const trees = [];
  for(let i=0;i<11;i++){
    const t = randomFreeTile(map, solid, false, reserved);
    if(t){ trees.push({c:t.c, r:t.r, shaken:false}); solid.add(t.c+','+t.r); }
  }

  const fishSpots = computeFishSpots(map);

  const villagers = VILLAGERS_DEF.map(v=>{
    const t = randomFreeTile(map, solid, true, reserved);
    return {...v, x:(t?t.c:9)*TILE+TILE/2, y:(t?t.r:6)*TILE+TILE/2, tx:null, ty:null, moveTimer:Math.random()*2};

function buildMap(){
  const m = [];
  for(let r=0;r<ROWS;r++){
    const row=[];
    for(let c=0;c<COLS;c++) row.push(0);
    m.push(row);
  }
  // pond blob bottom-left
  const pond = [[2,7],[3,7],[4,7],[2,8],[3,8],[4,8],[5,8],[2,9],[3,9],[4,9],[3,10]];
  pond.forEach(([c,r])=>{ if(m[r]) m[r][c]=2; });
  // paths
  for(let r=0;r<ROWS;r++) m[r][9]=1;
  for(let c=2;c<=13;c++) m[6][c]=1;
  // flowers decorative
  const flowers = [[15,3],[16,3],[15,4],[6,9],[7,9],[6,10],[12,9],[13,10]];
  flowers.forEach(([c,r])=>{ if(m[r] && m[r][c]===0) m[r][c]=4; });
  // ひまわり畑（既存の花とは別の一角）
  SUNFLOWER_TILES.forEach(([c,r])=>{ if(m[r] && m[r][c]===0) m[r][c]=4; });
  return m;
}

function buildForestMap(){
  const m = [];
  for(let r=0;r<ROWS;r++){
    const row=[];
    for(let c=0;c<COLS;c++) row.push(5); // 5 = forest floor
    m.push(row);
  }
  for(let r=0;r<ROWS;r++) m[r][9]=1; // path continuing in from the gate
  return m;
}

function randomFreeForestTile(map, solid){
  for(let tries=0; tries<200; tries++){
    const c = 1+Math.floor(Math.random()*(COLS-2));
    const r = 1+Math.floor(Math.random()*(ROWS-2));
    if(solid.has(c+','+r)) continue;
    if(c===9) continue; // keep the entry path clear
    return {c,r};
  }
  return null;
}

function randomForestTileNearPlayer(minTiles, maxTiles){
  if(!G.forest) return null;
  const pc = G.player.x/TILE, pr = G.player.y/TILE;
  for(let tries=0; tries<60; tries++){
    const ang = Math.random()*Math.PI*2;
    const dist = minTiles + Math.random()*(maxTiles-minTiles);
    const c = Math.round(pc + Math.cos(ang)*dist);
    const r = Math.round(pr + Math.sin(ang)*dist);
    if(c<1||c>=COLS-1||r<1||r>=ROWS-1) continue;
    if(G.forest.solid.has(c+','+r)) continue;
    return {c,r};
  }
  return randomFreeForestTile(G.forest.map, G.forest.solid);
}

function nearestTreeTile(fromC, fromR){
  if(!G.forest) return null;
  const all = [...(G.forest.trees||[]), ...(G.forest.ancientTrees||[])];
  let best=null, bestD=Infinity;
  all.forEach(t=>{
    const d = Math.hypot(t.c-fromC, t.r-fromR);
    if(d<bestD){ bestD=d; best=t; }
  });
  return best;
}

function setGroupOpacity(group, alpha){
  group.traverse(obj=>{
    if(obj.material){
      obj.material.transparent = true;
      obj.material.opacity = obj.userData && obj.userData.isShadow ? alpha*0.18 : alpha;
    }
  });
}

function generateForestZone(){
  const map = buildForestMap();
  const solid = new Set();
  const trees = [];
  for(let i=0;i<20;i++){
    const t = randomFreeForestTile(map, solid);
    if(t){ trees.push({c:t.c, r:t.r, shaken:false}); solid.add(t.c+','+t.r); }
  }
  const ancientTrees = [];
  for(let i=0;i<2;i++){
    const t = randomFreeForestTile(map, solid);
    if(t){ ancientTrees.push({c:t.c, r:t.r, shaken:false}); solid.add(t.c+','+t.r); }
  }
  if(G.depthsUnlocked && ancientTrees[0]) ancientTrees[0].deepEntrance = true;
  const sparkles = [];
  for(let i=0;i<3;i++){
    const t = randomFreeForestTile(map, solid);
    if(t) sparkles.push({c:t.c, r:t.r});
  }
  return {map, solid, trees, ancientTrees, sparkles, zone:'outer'};
}

function generateDepthsZone(){
  const map = buildForestMap();
  const solid = new Set();
  const ancientTrees = [];
  [{c:5,r:4},{c:13,r:4},{c:5,r:9},{c:13,r:9}].forEach(s=>{
    ancientTrees.push({c:s.c, r:s.r, usedThisVisit:false});
    solid.add(s.c+','+s.r);
  });
  solid.add(DEPTHS_SHRINE_TILE.c+','+DEPTHS_SHRINE_TILE.r);
  const sparkles = [];
  for(let i=0;i<3;i++){
    const t = randomFreeForestTile(map, solid);
    if(t) sparkles.push({c:t.c, r:t.r});
  }
  return {
    map, solid, trees:[], ancientTrees, sparkles, zone:'depths',
    shrine:{c:DEPTHS_SHRINE_TILE.c, r:DEPTHS_SHRINE_TILE.r, done:G.depthsCompleted},
  };
}

function markWaterSolid(map, solid){
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(map[r][c]===2) solid.add(c+','+r);
}

function computeFishSpots(map){
  const spots = [];
  const seen = new Set();
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(map[r][c]!==2) continue;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dc,dr])=>{
      const nc=c+dc, nr=r+dr;
      if(nr<0||nr>=ROWS||nc<0||nc>=COLS) return;
      if(map[nr][nc]!==2 && !seen.has(nc+','+nr)){ seen.add(nc+','+nr); spots.push({c:nc,r:nr}); }
    });
  }
  return spots;
}

function randomFreeTile(map, solid, allowNearWater, reserved){
  for(let tries=0; tries<200; tries++){
    const c = 1+Math.floor(Math.random()*(COLS-2));
    const r = 1+Math.floor(Math.random()*(ROWS-2));
    if(solid.has(c+','+r)) continue;
    if(reserved && reserved.has(c+','+r)) continue;
    if(map[r][c]===2) continue;
    if(c===9 && map[r][c]===1) continue; // keep main path a bit clearer
    return {c,r};
  }
  return null;
}

function spawnDailies(state){
  state.trees.forEach(t=>t.shaken=false);
  state.bugs = [];
  for(let i=0;i<4;i++){
    const t = randomFreeTile(state.map, state.solid, false, state.reserved);
    if(!t) continue;
    const type = ['bug_butterfly','bug_ladybug','bug_bee'][Math.floor(Math.random()*3)];
    state.bugs.push({id:Math.random().toString(36).slice(2,8), type, x:t.c*TILE+TILE/2, y:t.r*TILE+TILE/2, moveTimer:Math.random()*2});
  }
  state.sparkles = [];
  for(let i=0;i<3;i++){
    const t = randomFreeTile(state.map, state.solid, false, state.reserved);
    if(!t) continue;
    state.sparkles.push({c:t.c, r:t.r});
  }
}

      lastGenre:G.lastGenre, genreStreak:G.genreStreak,
      productionCount:G.productionCount, genreLastProducedAt:G.genreLastProducedAt,
      loreCount:G.loreCount, depthsUnlocked:G.depthsUnlocked, depthsCompleted:G.depthsCompleted,
    };
    localStorage.setItem('tsukurumura_save', JSON.stringify(slim));

function loadSaveRaw(){
  try{
    const raw = localStorage.getItem('tsukurumura_save');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function backupCurrentSave(){
  try{
    const raw = localStorage.getItem('tsukurumura_save');
    if(raw) localStorage.setItem('tsukurumura_save_backup', raw);
  }catch(e){ /* storage unavailable, ignore */ }
}
function loadBackupRaw(){
  try{
    const raw = localStorage.getItem('tsukurumura_save_backup');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function exportSaveToFile(){
  const raw = localStorage.getItem('tsukurumura_save');
  if(!raw){ showFlavorToast && showFlavorToast('セーブデータがありません。'); return; }
  const blob = new Blob([raw], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const vname = (loadSaveRaw()||{}).villageName || 'village';
  a.download = `tsukurumura_save_${vname}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
function importSaveFromFile(file, onDone){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed!=='object') throw new Error('invalid');
      backupCurrentSave();
      localStorage.setItem('tsukurumura_save', JSON.stringify(parsed));
      onDone(true);
    }catch(e){
      onDone(false);
    }
  };
  reader.onerror = ()=> onDone(false);
  reader.readAsText(file);
}
function loadSaveIntoGame(data){
  G = newGame(data.playerName, data.villageName, data.avatar||AVATARS[0], data.playerColor||PLAYER_COLORS[0]);
  G.day = data.day||1;
  G.bells = data.bells!=null?data.bells:300;
  G.popularity = data.popularity||0;
  G.inventory = data.inventory||{};
  G.houseFurniture = data.houseFurniture||[];
  G.placedFurnitureTypes = data.placedFurnitureTypes||[];
  G.studio = data.studio||[];
  G.gallery = data.gallery||[];
  G.workDefs = data.workDefs||{};
  G.acquireLog = data.acquireLog||[];
  G.songs = data.songs||[];
  G.bgmDaySongId = data.bgmDaySongId!=null ? data.bgmDaySongId : (data.bgmSongId||null);
  G.bgmNightSongId = data.bgmNightSongId||null;
  G.villagerGifts = data.villagerGifts||{};
  G.villagerStatBonus = data.villagerStatBonus||{};
  G.phase = data.phase||'day';
  G.phaseElapsed = data.phaseElapsed||0;
  G.lastGenre = data.lastGenre || null;
  G.genreStreak = data.genreStreak || 0;
  if(data.productionCount != null){
    G.productionCount = data.productionCount;
    G.genreLastProducedAt = data.genreLastProducedAt || {};
  } else {
    // 既存セーブ互換：新鮮さシステム導入前のセーブは、ギャラリー履歴から作り直す
    rebuildGenreHistoryFromGallery();
  }
  // 既存セーブ互換：以前から持っていた分は「手持ち数」を最低ラインとして累計に反映する
  const invNote = (G.inventory && G.inventory['note_page']) || 0;
  const invOdd = (G.inventory && G.inventory['odd_item']) || 0;
  const savedLore = data.loreCount || {note:0, odd:0};
  G.loreCount = {
    note: Math.max(savedLore.note||0, invNote),
    odd: Math.max(savedLore.odd||0, invOdd),
  };
  G.depthsUnlocked = !!data.depthsUnlocked;
  G.depthsCompleted = !!data.depthsCompleted;
  if(!G.depthsUnlocked && G.loreCount.note>=DEPTHS_UNLOCK_NOTE && G.loreCount.odd>=DEPTHS_UNLOCK_ODD){
    G.depthsUnlocked = true;
  }
}

let joystickActive = false;
let joystickVec = {x:0, y:0};

function wireControls(){
  const base = document.getElementById('joystickBase');
  const knob = document.getElementById('joystickKnob');
  const wrap = document.getElementById('joystickWrap');
  if(base && knob && wrap){
    const RADIUS = 40; // 見た目の台座半径よりわずかに狭く、つまみが枠内に収まるように
    let activePointerId = null;
    const setKnob = (dx, dy)=>{
      knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    };
    const resetKnob = ()=>{
      setKnob(0,0);
      joystickActive = false;
      joystickVec.x = 0; joystickVec.y = 0;
      base.classList.remove('active');
    };
    const updateFromEvent = (clientX, clientY)=>{
      const rect = base.getBoundingClientRect();
      const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
      let dx = clientX - cx, dy = clientY - cy;
      const dist = Math.hypot(dx,dy);
      const clamped = Math.min(dist, RADIUS);
      const angle = Math.atan2(dy,dx);
      const kx = Math.cos(angle)*clamped, ky = Math.sin(angle)*clamped;
      setKnob(kx, ky);
      const mag = clamped/RADIUS;
      joystickVec.x = mag>0.08 ? Math.cos(angle)*mag : 0;
      joystickVec.y = mag>0.08 ? Math.sin(angle)*mag : 0;
      joystickActive = mag>0.08;
      base.classList.toggle('active', joystickActive);
    };
    const onDown = (e)=>{
      e.preventDefault();
      activePointerId = e.pointerId;
      base.setPointerCapture && base.setPointerCapture(e.pointerId);
      updateFromEvent(e.clientX, e.clientY);
    };
    const onMove = (e)=>{
      if(activePointerId===null || e.pointerId!==activePointerId) return;
      e.preventDefault();
      updateFromEvent(e.clientX, e.clientY);
    };
    const onUp = (e)=>{
      if(activePointerId!==null && e.pointerId!==activePointerId) return;
      activePointerId = null;
      resetKnob();
    };
    wrap.addEventListener('pointerdown', onDown, {passive:false});
    wrap.addEventListener('pointermove', onMove, {passive:false});
    wrap.addEventListener('pointerup', onUp, {passive:false});
    wrap.addEventListener('pointercancel', onUp, {passive:false});
    wrap.addEventListener('pointerleave', (e)=>{ if(e.pointerId===activePointerId) onUp(e); });
  }
  const runBtn = document.getElementById('btnRun');
  if(runBtn){
    const pressRun = (e)=>{ e.preventDefault(); keys['ShiftLeft']=true; runBtn.classList.add('active'); };
    const releaseRun = (e)=>{ e.preventDefault(); keys['ShiftLeft']=false; runBtn.classList.remove('active'); };
    runBtn.addEventListener('mousedown', pressRun);
    runBtn.addEventListener('touchstart', pressRun, {passive:false});
    runBtn.addEventListener('mouseup', releaseRun);
    runBtn.addEventListener('touchend', releaseRun, {passive:false});
    runBtn.addEventListener('mouseleave', releaseRun);
  }
  document.getElementById('btnAction').addEventListener('click', ()=>{
    const modalOpen = document.getElementById('modalOverlay').classList.contains('show');
    if(modalOpen){
      const closeBtn = document.getElementById('closeDialogue');
      if(closeBtn) closeBtn.click();
      return;
    }
    doAction();
  });
}

/* ============================================================
   GAME LOOP
   ============================================================ */
function startGameLoop(){
  renderGameShell();
  renderAcquireLog();
  initThreeScene();
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function loop(t){
  const dt = Math.min(0.05, (t-lastTime)/1000);
  lastTime = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function update(dt){
  updateDayNightCycle(dt);
  updatePlayer(dt);
  updateVillagers(dt);
  updateBugs(dt);
  updateParticles(dt);
  updatePrompt();
  updateLightGauge(dt);
  updatePaleEncounterTimer(dt);
}

function updateDayNightCycle(dt){
  if(G.phase==null) G.phase = 'day';
  if(G.phaseElapsed==null) G.phaseElapsed = 0;
  if(G.phase==='day'){
    G.phaseElapsed += dt;
    if(G.phaseElapsed >= DAY_PHASE_SECONDS){
      G.phase = 'night';
      G.phaseElapsed = 0;
      applyPhaseLighting();
      refreshBgmForCurrentPhase();
      showFlavorToast('夜になった。村から人の気配が消えていく。');
      renderGameShellTop();
    }
  }
  // 夜は寝るまで自然には明けない
}

/* ---------- 森の奥：気配イベント（正体を説明しない気配演出） ---------- */
function updatePaleEncounterTimer(dt){
  if(G.scene!=='forest' || !G.forest) return;
  if(G.forest.zone==='depths'){
    if(G.forest.paleTimer==null) G.forest.paleTimer = 3+Math.random()*2;
    G.forest.paleTimer -= dt;
    if(G.forest.paleTimer<=0){
      G.forest.paleTimer = 4+Math.random()*3;
      showFlavorToast(randPick(DEPTHS_LINES));
    }
    return;
  }
  if(G.forest.paleTimer==null) G.forest.paleTimer = 5+Math.random()*3;
  G.forest.paleTimer -= dt;
  if(G.forest.paleTimer<=0){
    const urgency = 1 - (G.lightGauge/LIGHT_GAUGE_MAX); // 灯りが減るほど頻度が上がる
    G.forest.paleTimer = Math.max(3, 8 - urgency*3) + Math.random()*3;
    if(Math.random() < 0.5 + urgency*0.2) triggerForestPhenomenon();
  }
}

function triggerForestPhenomenon(){
  if(G.phase==='night' && G.villagers.length && Math.random() < 0.10){
    spawnVillagerSightingEvent();
    return;
  }
  const roll = Math.random();
  if(roll < 0.14) spawnFigureEncounter();
  else if(roll < 0.30) spawnSoundEvent();
  else if(roll < 0.42) spawnFoundObjectEvent();
  else if(roll < 0.54) spawnDisorientEvent();
  else if(roll < 0.62) spawnLightFlickerEvent();
  else if(roll < 0.82) spawnGentleBreezeEvent();
  else spawnFireflyEvent();
}

function updateForestVillagerSightings(dt){
  forestVillagerSightings = forestVillagerSightings.filter(s=>{
    s.life -= dt;
    const elapsed = s.maxLife - s.life;
    if(!s.vanished){
      const walkDuration = s.maxLife*0.8;
      const walkT = Math.min(1, elapsed/walkDuration);
      s.mesh.position.x = s.startX + (s.endX-s.startX)*walkT;
      s.mesh.position.z = s.startZ + (s.endZ-s.startZ)*walkT;
      const curPx = s.startPx + (s.endPx-s.startPx)*walkT;
      const curPy = s.startPy + (s.endPy-s.startPy)*walkT;
      let alpha = elapsed<0.4 ? elapsed/0.4 : (s.life<0.6 ? Math.max(0, s.life/0.6) : 1);
      setGroupOpacity(s.mesh, alpha);
      const dist = Math.hypot(G.player.x-curPx, G.player.y-curPy);
      if(dist < TILE*2.2){
        s.vanished = true;
        s.life = Math.min(s.life, 0.4);
        showFlavorToast(randPick(FOREST_VILLAGER_VANISH_LINES));
      }
    } else {
      setGroupOpacity(s.mesh, Math.max(0, s.life/0.4));
    }
    if(s.life<=0){ forestGroup && forestGroup.remove(s.mesh); return false; }
    return true;
  });
}

function updatePaleEncounters(dt){
  paleEncounters = paleEncounters.filter(p=>{
    p.life -= dt;
    const elapsed = p.maxLife - p.life;
    const walkDuration = p.maxLife*0.75;
    const walkT = Math.min(1, elapsed/walkDuration);
    p.mesh.position.x = p.startX + (p.endX-p.startX)*walkT;
    p.mesh.position.z = p.startZ + (p.endZ-p.startZ)*walkT;
    let alpha;
    if(elapsed<0.4) alpha = elapsed/0.4;
    else if(p.life<0.6) alpha = Math.max(0, p.life/0.6);
    else alpha = 1;
    setGroupOpacity(p.mesh, alpha);
    if(p.life<=0){ forestGroup && forestGroup.remove(p.mesh); return false; }
    return true;
  });
}

function updateLightGauge(dt){
  if(G.scene!=='forest') return;
  G.lightGauge -= dt*LIGHT_DRAIN_PER_SEC;
  updateLightGaugeUI();
  if(G.lightGauge<=0){
    G.lightGauge = 0;
    returnFromForestOutOfLight();
  }
}

}

/* ---------- player movement ---------- */
function updatePlayer(dt){
  const p = G.player;
  let dx=0, dy=0, mag=1;
  if(joystickActive){
    dx = joystickVec.x; dy = joystickVec.y;
    mag = Math.min(1, Math.hypot(dx,dy));
  } else {
    if(keys['ArrowUp']||keys['KeyW']) dy-=1;
    if(keys['ArrowDown']||keys['KeyS']) dy+=1;
    if(keys['ArrowLeft']||keys['KeyA']) dx-=1;
    if(keys['ArrowRight']||keys['KeyD']) dx+=1;
  }
  if(dx===0&&dy===0) return;
  const len = Math.hypot(dx,dy)||1;
  dx/=len; dy/=len;
  if(Math.abs(dx)>Math.abs(dy)) p.dir = dx>0?'right':'left';
  else if(dy!==0) p.dir = dy>0?'down':'up';

  const running = keys['ShiftLeft'] || keys['ShiftRight'];
  const speed = p.speed * (running ? 1.8 : 1) * mag;
  const nx = p.x + dx*speed*dt;
  const ny = p.y + dy*speed*dt;
  const r = 11;
  if(!isSolidPx(nx, p.y, r)) p.x = nx;
  if(!isSolidPx(p.x, ny, r)) p.y = ny;
  p.x = Math.max(TILE*0.4, Math.min(CW-TILE*0.4, p.x));
  p.y = Math.max(TILE*0.4, Math.min(CH-TILE*0.4, p.y));
}

function isSolidPx(x,y,r){
  const pts = [[x-r,y-r],[x+r,y-r],[x-r,y+r],[x+r,y+r]];
  for(const [px,py] of pts){
    const c = Math.floor(px/TILE), row = Math.floor(py/TILE);
    if(c<0||c>=COLS||row<0||row>=ROWS) return true;
    if(G.scene==='village'){
      if(G.solid.has(c+','+row)) return true;
    } else if(G.scene==='forest'){
      if(G.forest && G.forest.solid.has(c+','+row)) return true;
    } else {
      if(!inHouseFloor(c,row)) return true;
      if(G.houseFurniture.some(f=>f.c===c&&f.r===row)) return true;
    }
  }
  return false;
}

function inHouseFloor(c,r){
  return c>=1 && c<=COLS-2 && r>=1 && r<=ROWS-2;
}

/* ---------- villagers ---------- */
function updateVillagers(dt){
  if(G.scene!=='village' || G.phase==='night') return;
  G.villagers.forEach(v=>{
    v.moveTimer -= dt;
    if(v.moveTimer<=0){
      v.moveTimer = 2+Math.random()*3;
      const ang = Math.random()*Math.PI*2;
      const dist = 20+Math.random()*30;
      v.tx = v.x + Math.cos(ang)*dist;
      v.ty = v.y + Math.sin(ang)*dist;
      v.tx = Math.max(TILE, Math.min(CW-TILE, v.tx));
      v.ty = Math.max(TILE, Math.min(CH-TILE, v.ty));
    }
    if(v.tx!=null){
      const dx = v.tx-v.x, dy = v.ty-v.y;
      const d = Math.hypot(dx,dy);
      if(d>2){ v.x += (dx/d)*20*dt; v.y += (dy/d)*20*dt; }
    }
  });
}

function updateBugs(dt){
  if(G.scene!=='village') return;
  G.bugs.forEach(b=>{
    b.moveTimer -= dt;
    if(b.moveTimer<=0){
      b.moveTimer = 1+Math.random()*2;
      b.tx = b.x + (Math.random()-0.5)*40;
      b.ty = b.y + (Math.random()-0.5)*40;
    }
    if(b.tx!=null){
      const dx=b.tx-b.x, dy=b.ty-b.y, d=Math.hypot(dx,dy);
      if(d>2){ b.x += (dx/d)*30*dt; b.y += (dy/d)*30*dt; }
    }
  });
}

function updateParticles(dt){
  particles.forEach(p=>p.life -= dt);
  particles = particles.filter(p=>p.life>0);
}

function addParticle(text, x, y){
  const wp = toWorld(x, y);
  addParticle3D(text, wp.x, wp.z);
}

/* ---------- interaction detection ---------- */
function findInteractable(){
  const p = G.player;
  const range = 26;
  if(G.scene==='village'){
    const pc0 = Math.floor(p.x/TILE), pr0 = Math.floor(p.y/TILE);
    for(const b of G.buildings){
      if(pc0===b.doorC && pr0===b.doorR) return {type:'door', ref:b};
    }
    if(pc0===FOREST_GATE_TILE.c && pr0===FOREST_GATE_TILE.r) return {type:'forestGate'};
    for(const v of G.villagers){
      if(G.phase==='night') break;
      if(Math.hypot(p.x-v.x, p.y-v.y) < range) return {type:'villager', ref:v};
    }
    for(const t of G.trees){
      if(t.shaken) continue;
      const tx=t.c*TILE+TILE/2, ty=t.r*TILE+TILE/2;
      if(Math.hypot(p.x-tx,p.y-ty) < range+6) return {type:'tree', ref:t};
    }
    for(const sp of G.sparkles){
      const tx=sp.c*TILE+TILE/2, ty=sp.r*TILE+TILE/2;
      if(Math.hypot(p.x-tx,p.y-ty) < range) return {type:'sparkle', ref:sp};
    }
    for(const b of G.bugs){
      if(Math.hypot(p.x-b.x,p.y-b.y) < range-4) return {type:'bug', ref:b};
    }
    const pc = Math.floor(p.x/TILE), pr = Math.floor(p.y/TILE);
    if(G.fishSpots.some(f=>f.c===pc&&f.r===pr)) return {type:'fish'};
  } else if(G.scene==='forest'){
    const pc0 = Math.floor(p.x/TILE), pr0 = Math.floor(p.y/TILE);
    if(G.forest && G.forest.zone==='depths'){
      if(pc0===DEPTHS_DOOR_TILE.c && pr0===DEPTHS_DOOR_TILE.r) return {type:'depthsExit'};
      if(G.forest.shrine){
        const sx=G.forest.shrine.c*TILE+TILE/2, sy=G.forest.shrine.r*TILE+TILE/2;
        if(Math.hypot(p.x-sx,p.y-sy) < range+10) return {type:'shrine', ref:G.forest.shrine};
      }
      for(const t of G.forest.ancientTrees){
        const tx=t.c*TILE+TILE/2, ty=t.r*TILE+TILE/2;
        if(Math.hypot(p.x-tx,p.y-ty) < range+6) return {type:'depthsMemory', ref:t};
      }
      for(const sp of G.forest.sparkles){
        const tx=sp.c*TILE+TILE/2, ty=sp.r*TILE+TILE/2;
        if(Math.hypot(p.x-tx,p.y-ty) < range) return {type:'forestSparkle', ref:sp};
      }
      return null;
    }
    if(pc0===FOREST_EXIT_TILE.c && pr0===FOREST_EXIT_TILE.r) return {type:'forestExit'};
    if(G.forest){
      for(const t of G.forest.ancientTrees){
        const tx=t.c*TILE+TILE/2, ty=t.r*TILE+TILE/2;
        if(Math.hypot(p.x-tx,p.y-ty) >= range+6) continue;
        if(t.deepEntrance) return {type:'deepEntrance', ref:t};
        if(t.shaken) continue;
        return {type:'ancientTree', ref:t};
      }
      for(const t of G.forest.trees){
        if(t.shaken) continue;
        const tx=t.c*TILE+TILE/2, ty=t.r*TILE+TILE/2;
        if(Math.hypot(p.x-tx,p.y-ty) < range+6) return {type:'forestTree', ref:t};
      }
      for(const sp of G.forest.sparkles){
        const tx=sp.c*TILE+TILE/2, ty=sp.r*TILE+TILE/2;
        if(Math.hypot(p.x-tx,p.y-ty) < range) return {type:'forestSparkle', ref:sp};
      }
    }
  } else {
    const pc = Math.floor(p.x/TILE), pr = Math.floor(p.y/TILE);
    if(pc===COLS/2 && pr===ROWS-2) return {type:'exit'};
    if(pc===1 && pr===1) return {type:'bed'};
    const furn = G.houseFurniture.find(f=>Math.hypot((f.c*TILE+TILE/2)-p.x,(f.r*TILE+TILE/2)-p.y) < range+16);
    if(furn && !placementItem && !movingFurniture) return {type:'furniture', ref:furn};
  }
  if(G.scene==='house' && (placementItem || movingFurniture)){
    return {type:'placing'};
  }
  return null;
}

const PROMPT_TEXT = {
  villager:'話しかける', tree:'木を揺らす', sparkle:'掘る',
  bug:'捕まえる', fish:'釣る', door:'入る',
  exit:'村に出る', bed:'眠る', furniture:'動かす・しまう',
  placing:'空いている場所をタップ（Eでキャンセル）',
  forestGate:'森の奥へ入る', forestExit:'村へ戻る',
  forestTree:'木を揺らす', ancientTree:'白い大樹を揺らす', forestSparkle:'掘る',
  deepEntrance:'白く光る裂け目に入る', depthsExit:'森の入り口へ戻る', shrine:'ほこらに祈りを捧げる',
  depthsMemory:'そっと触れてみる',
};

function updatePrompt(){
  const el = document.getElementById('promptBubble');
  if(!el) return;
  if(fishing) return;
  const it = findInteractable();
  if(it && PROMPT_TEXT[it.type]){
    let label = it.type==='door' ? `「${it.ref.name}」に入る` : PROMPT_TEXT[it.type];
    if(it.type==='bed') label = G.phase==='night' ? '眠る' : 'ひとやすみする';
    if(it.type==='shrine') label = it.ref.done ? 'ほこらにそっと触れる' : 'ほこらに祈りを捧げる';
    el.textContent = it.type==='placing' ? label : `▶ ${label}`;
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

/* ============================================================
   ACTIONS
   ============================================================ */
function doAction(){
  const it = findInteractable();
  if(!it) return;
  const p = G.player;
  if(it.type==='tree') return shakeTree(it.ref);
  if(it.type==='sparkle') return digSparkle(it.ref);
  if(it.type==='bug') return catchBug(it.ref);
  if(it.type==='fish') return goFishing();
  if(it.type==='villager') return talkTo(it.ref);
  if(it.type==='door') return enterBuilding(it.ref);
  if(it.type==='exit') return exitHouse();
  if(it.type==='bed') return sleep();
  if(it.type==='furniture') return openFurnitureMenu(it.ref);
  if(it.type==='forestGate') return enterForest();
  if(it.type==='forestExit') return exitForest();
  if(it.type==='forestTree') return shakeForestTree(it.ref);
  if(it.type==='ancientTree') return shakeAncientTree(it.ref);
  if(it.type==='forestSparkle') return digForestSparkle(it.ref);
  if(it.type==='deepEntrance') return enterDepths();
  if(it.type==='depthsExit') return exitDepths();
  if(it.type==='shrine') return prayAtShrine(it.ref);
  if(it.type==='depthsMemory') return touchMemoryTree(it.ref);
  if(it.type==='placing'){
    if(movingFurniture){ movingFurniture=null; showFlavorToast('移動をキャンセルした'); }
    else if(placementItem){ placementItem=null; showFlavorToast('設置をキャンセルした'); }
    return;
  }
}

function openFurnitureMenu(f){
  const def = getItemDef(f.itemId);
  openModal(`
    <h2>${def?def.icon:'📦'} ${def?def.name:'家具'}</h2>
    <p class="mdesc">この家具をどうする？</p>
    <div class="btn-row">
      <button class="mini-btn buy" id="startMove">🖐️ 動かす</button>
      <button class="mini-btn" id="doPickup">📦 しまう（持ち物へ）</button>
      <button class="mini-btn" id="cancelFurnMenu">とじる</button>
    </div>
  `);
  document.getElementById('startMove').onclick = ()=>{
    closeModal();
    movingFurniture = f;
    showFlavorToast('移動先をタップしてね（Eでキャンセル）');
  };
  document.getElementById('doPickup').onclick = ()=>{
    closeModal();
    pickupFurniture(f);
  };

}

function addItem(id, n){
  n = n||1;
  G.inventory[id] = (G.inventory[id]||0)+n;
  const def = getItemDef(id);
  if(def) logAcquire(`${def.icon} ${def.name} ×${n} を入手`);
}

function logAcquire(text){
  G.acquireLog.unshift({text, day:G.day});
  if(G.acquireLog.length>30) G.acquireLog.length = 30;
  renderAcquireLog();
}

function renderAcquireLog(){
  const el = document.getElementById('acquireLog');
  if(!el) return;
  if(!G.acquireLog.length){
    el.innerHTML = '<div class="log-empty">まだ何も入手していません。</div>';
    return;
  }
  el.innerHTML = G.acquireLog.map(e=>`<div class="log-row">${e.text}</div>`).join('');
}

function shakeTree(tree){
  tree.shaken = true;
  const roll = Math.random();
  let got;
  if(roll<0.5) got='wood'; else if(roll<0.8) got='apple'; else got='chestnut';
  addItem(got,1);
  addParticle(`+1 ${getItemDef(got).icon}`, tree.c*TILE+TILE/2, tree.r*TILE);
  renderInventoryStrip(); saveGame();
}

function digSparkle(sp){
  G.sparkles = G.sparkles.filter(s=>s!==sp);
  const roll = Math.random();
  let got, amt=1;
  if(roll<0.15){ got='gem'; }
  else if(roll<0.45){ got='fossil'; }
  else { got=null; amt = 50+Math.floor(Math.random()*50); G.bells += amt; logAcquire(`💰 ${amt}ベル を発見`); }
  if(got){ addItem(got,1); addParticle(`+1 ${getItemDef(got).icon}`, sp.c*TILE+TILE/2, sp.r*TILE); }
  else addParticle(`+${amt} 💰`, sp.c*TILE+TILE/2, sp.r*TILE);
  renderInventoryStrip(); saveGame(); renderGameShellTop();
}

function catchBug(bug){
  G.bugs = G.bugs.filter(b=>b!==bug);
  addItem(bug.type,1);
  addParticle(`+1 ${getItemDef(bug.type).icon}`, bug.x, bug.y);
  renderInventoryStrip(); saveGame();
}

/* ---------- Forest zone actions ---------- */
let bgmWasPlayingBeforeForest = false;
function enterForest(){
  G.forest = generateForestZone();
  G.forest.paleTimer = 4+Math.random()*4;
  paleEncounters = [];
  forestVillagerSightings = [];
  G.lightGauge = LIGHT_GAUGE_MAX;
  G.scene = 'forest';
  G.player.x = FOREST_EXIT_TILE.c*TILE+TILE/2;
  G.player.y = (FOREST_EXIT_TILE.r-1)*TILE+TILE/2;
  buildForestGroup();
  const wrap = document.getElementById('lightGaugeWrap');
  if(wrap) wrap.style.display = 'block';
  updateLightGaugeUI();
  bgmWasPlayingBeforeForest = bgmPlaying;
  stopBGM();
  if(G.depthsUnlocked && !G.depthsCompleted){
    showFlavorToast('森の奥に足を踏み入れた…どこかに、白く光る裂け目があるかもしれない。');
  } else {
    showFlavorToast('森の奥に足を踏み入れた…灯りが尽きる前に村へ戻ろう。');
  }
}

function exitForest(){
  G.scene = 'village';
  G.player.x = FOREST_GATE_TILE.c*TILE+TILE/2;
  G.player.y = (FOREST_GATE_TILE.r+1)*TILE+TILE/2;
  const wrap = document.getElementById('lightGaugeWrap');
  if(wrap) wrap.style.display = 'none';
  paleEncounters.forEach(p=>forestGroup && forestGroup.remove(p.mesh));
  paleEncounters = [];
  forestVillagerSightings.forEach(s=>forestGroup && forestGroup.remove(s.mesh));
  forestVillagerSightings = [];
  if(bgmWasPlayingBeforeForest){
    const activeId = currentBgmSongId();
    const song = activeId ? G.songs.find(s=>s.id===activeId) : null;
    if(song) startBGM(song);
  }
  saveGame();
}

function returnFromForestOutOfLight(){
  showFlavorToast('灯りが白く尽きて…気づけば村への道を歩いていた。');
  exitForest();
}

    return;
  }
  ref.done = true;

let fishing = false;
function goFishing(){
  if(fishing) return;
  fishing = true;
  const el = document.getElementById('promptBubble');
  if(el){ el.textContent = '……'; el.style.display='block'; }
  const wait = 700+Math.random()*1200;
  setTimeout(()=>{
    if(!fishing) return;
    if(el){ el.textContent = '❗ 今アクション！'; }
    let caught=false;
    const onKey = (e)=>{
      if(e.code==='Space' || e.code==='KeyE'){ caught=true; finishFishing(true); }
    };
    window.addEventListener('keydown', onKey, {once:true});
    const btn = document.getElementById('btnAction');
    const onClick = ()=>{ if(!caught){ caught=true; finishFishing(true); } };
    if(btn) btn.addEventListener('click', onClick, {once:true});
    setTimeout(()=>{ if(!caught) finishFishing(false); }, 900);
  }, wait);
}
function finishFishing(success){
  fishing = false;
  if(success){
    const table = ['fish_carp','fish_carp','fish_trop','fish_shrimp','fish_junk'];
    const got = table[Math.floor(Math.random()*table.length)];
    addItem(got,1);
    addParticle(`+1 ${getItemDef(got).icon}`, G.player.x, G.player.y-20);
  } else {
    addParticle('…にげられた', G.player.x, G.player.y-20);
  }
  renderInventoryStrip(); saveGame();
}

function isRecruited(v){ return G.studio.some(s=>s.id===v.id); }
function effectiveScoutCost(v){
  const discount = (G.villagerGifts && G.villagerGifts[v.id]) || 0;
  return Math.max(15, v.scoutCost - discount);
}

function talkTo(v){
  const lineIsRequest = Math.random()<0.3 && !isRecruited(v);
  let bodyHtml, footHtml='';
  if(lineIsRequest){
    const mat = REQUEST_MATERIALS[Math.floor(Math.random()*REQUEST_MATERIALS.length)];
    const have = (G.inventory[mat]||0)>0;
    bodyHtml = `${getItemDef(mat).name}${getItemDef(mat).icon} を持ってない？ お礼にベルをあげるよ。`;
    footHtml = `<div class="btn-row"><button class="mini-btn buy" id="giveBtn" ${have?'':'disabled'}>${getItemDef(mat).icon} わたす</button><button class="mini-btn" id="closeDialogue">とじる</button></div>`;
    setTimeout(()=>{
      const gb = document.getElementById('giveBtn');
      if(gb) gb.onclick = ()=>{
        G.inventory[mat] -= 1;
        const reward = 15+Math.floor(Math.random()*20);
        G.bells += reward;
        logAcquire(`💰 ${reward}ベル を${v.name}からもらった`);
        renderInventoryStrip(); renderGameShellTop(); saveGame();
        showDialogue(v, `ありがとう！ おかげで助かったよ。（+${reward}ベル）`);
      };
      const cb = document.getElementById('closeDialogue');
      if(cb) cb.onclick = closeModal;
    },0);
  } else {
    const line = v.lines[Math.floor(Math.random()*v.lines.length)];
    bodyHtml = line;
    if(isRecruited(v)){
      const bonus = G.villagerStatBonus[v.id] || {tech:0,idea:0,coop:0};
      const total = bonus.tech+bonus.idea+bonus.coop;
      const maxedNow = bonus.tech>=VILLAGER_STAT_CAP && bonus.idea>=VILLAGER_STAT_CAP && bonus.coop>=VILLAGER_STAT_CAP;

};
function scaleNotes(scaleId){ return (NOTE_SCALES[scaleId]||NOTE_SCALES.pentatonic).notes; }
const SONG_STEPS = 16;
const SONG_INSTRUMENTS = [
  {id:'sine', name:'まる〜い音'}, {id:'triangle', name:'やわらかい音'},
  {id:'square', name:'ピコピコ音'}, {id:'sawtooth', name:'するどい音'},

const CHORD_LECTURE = [
  {name:'ド・ミ・ソ（明るい和音）', rows:[7,5,4], desc:'一番おさまりのいい和音。曲の始まりや終わりに置くと落ち着く。', scale:'pentatonic'},
  {name:'ラ・ド・ミ（切ない和音）', rows:[3,2,0], desc:'少ししんみりした響き。盛り上がりの後や、しみじみした場面に。', scale:'pentatonic'},
  {name:'レ・ソ（浮遊感の2音）', rows:[6,4], desc:'2音だけの軽い和音。次の和音へつなぐ「橋」として使いやすい。', scale:'pentatonic'},
  {name:'ド・ソ（安定の2音）', rows:[7,4], desc:'和音というより土台。メロディの下に敷くと安心感が出る。', scale:'pentatonic'},
];

  {id:'kick', name:'バスドラム'},
  {id:'snare', name:'スネア'},
  {id:'hihat', name:'ハイハット'},
];
let composerGrid = null, composerDrumGrid = null, composerTempo = 100, composerInstrument = 'sine', composerTitle = '', composerScale = 'pentatonic';
let composerTimer = null, composerStep = 0;
let sharedAudioCtx = null;

function getAudioCtx(){
  if(!sharedAudioCtx) sharedAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(sharedAudioCtx.state==='suspended') sharedAudioCtx.resume();
  return sharedAudioCtx;
}
function playTone(freq, seconds, type, vol, ctxArg, when){
  try{
    const ctx = ctxArg || getAudioCtx();
    const startAt = when!=null ? when : ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    const peak = vol!=null ? vol : 0.22;
    gain.gain.setValueAtTime(0.0001, startAt);
    gain.gain.exponentialRampToValueAtTime(peak, startAt+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, startAt+seconds);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(startAt);
    osc.stop(startAt+seconds+0.03);
  }catch(e){ /* audio unavailable, ignore */ }
}
function playDrum(type, vol, ctxArg, when){
  try{
    const ctx = ctxArg || getAudioCtx();
    const startAt = when!=null ? when : ctx.currentTime;
    const peak = vol!=null ? vol : 0.3;
    if(type==='kick'){
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, startAt);
      osc.frequency.exponentialRampToValueAtTime(40, startAt+0.15);
      gain.gain.setValueAtTime(peak, startAt);
      gain.gain.exponentialRampToValueAtTime(0.0001, startAt+0.2);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(startAt); osc.stop(startAt+0.22);
    } else if(type==='snare'){
      const bufferSize = Math.floor(ctx.sampleRate*0.15);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const bandpass = ctx.createBiquadFilter();
      bandpass.type = 'bandpass'; bandpass.frequency.value = 1800;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(peak, startAt);
      gain.gain.exponentialRampToValueAtTime(0.0001, startAt+0.15);
      noise.connect(bandpass); bandpass.connect(gain); gain.connect(ctx.destination);
      noise.start(startAt); noise.stop(startAt+0.16);
    } else if(type==='hihat'){
      const bufferSize = Math.floor(ctx.sampleRate*0.05);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const highpass = ctx.createBiquadFilter();
      highpass.type = 'highpass'; highpass.frequency.value = 7000;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(peak*0.8, startAt);
      gain.gain.exponentialRampToValueAtTime(0.0001, startAt+0.05);
      noise.connect(highpass); highpass.connect(gain); gain.connect(ctx.destination);
      noise.start(startAt); noise.stop(startAt+0.06);
    }
  }catch(e){ /* audio unavailable, ignore */ }
}
function makeEmptyGrid(){
  return Array.from({length:8}, ()=>Array(SONG_STEPS).fill(false));

/* ---------- 曲のダウンロード（WAV書き出し） ---------- */
function wavWriteString(view, offset, str){
  for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i));
}
function audioBufferToWavBlob(buffer){
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const bitDepth = 16;
  const samples = buffer.getChannelData(0);
  const dataLength = samples.length * (bitDepth/8);
  const arrBuffer = new ArrayBuffer(44+dataLength);
  const view = new DataView(arrBuffer);
  wavWriteString(view, 0, 'RIFF');
  view.setUint32(4, 36+dataLength, true);
  wavWriteString(view, 8, 'WAVE');
  wavWriteString(view, 12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); // PCM
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate*numChannels*bitDepth/8, true);
  view.setUint16(32, numChannels*bitDepth/8, true);
  view.setUint16(34, bitDepth, true);
  wavWriteString(view, 36, 'data');
  view.setUint32(40, dataLength, true);
  let offset = 44;
  for(let i=0;i<samples.length;i++, offset+=2){
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s<0 ? s*0x8000 : s*0x7FFF, true);
  }
  return new Blob([view], {type:'audio/wav'});
}
async function exportSongAsWav(song){
  const OfflineCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if(!OfflineCtx) throw new Error('OfflineAudioContext unavailable');
  const notes = scaleNotes(song.scale);
  const stepSec = 60/song.tempo/2;
  const duration = SONG_STEPS*stepSec + 0.5;
  const sampleRate = 44100;
  const offlineCtx = new OfflineCtx(1, Math.ceil(sampleRate*duration), sampleRate);
  for(let step=0; step<SONG_STEPS; step++){
    const when = step*stepSec;
    for(let row=0; row<notes.length; row++){
      if(song.grid[row][step]) playTone(notes[row].freq, stepSec*0.9, song.instrument, 0.5, offlineCtx, when);
    }
    if(song.drumGrid){
      for(let row=0; row<DRUM_KIT.length; row++){
        if(song.drumGrid[row] && song.drumGrid[row][step]) playDrum(DRUM_KIT[row].id, 0.6, offlineCtx, when);
      }
    }
  }
  const rendered = await offlineCtx.startRendering();
  const blob = audioBufferToWavBlob(rendered);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (song.title || '曲').replace(/[\\/:*?"<>|]/g,'') + '.wav';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
function stopComposerPlayback(){
  if(composerTimer){ clearInterval(composerTimer); composerTimer = null; }
  document.querySelectorAll('.composer-cell.playhead').forEach(c=>c.classList.remove('playhead'));
}
function startComposerPlayback(grid, tempo, instrument, scaleId, drumGrid){
  stopBGM();
  stopComposerPlayback();
  const notes = scaleNotes(scaleId || composerScale);
  const drums = drumGrid || composerDrumGrid;
  composerStep = 0;
  const stepSec = 60/tempo/2;
  composerTimer = setInterval(()=>{
    document.querySelectorAll('.composer-cell.playhead').forEach(c=>c.classList.remove('playhead'));
    document.querySelectorAll(`.composer-cell[data-step="${composerStep}"]`).forEach(c=>c.classList.add('playhead'));
    for(let row=0; row<notes.length; row++){
      if(grid[row][composerStep]) playTone(notes[row].freq, stepSec*0.9, instrument);
    }
    if(drums){
      for(let row=0; row<DRUM_KIT.length; row++){
        if(drums[row] && drums[row][composerStep]) playDrum(DRUM_KIT[row].id);
      }
    }
    composerStep = (composerStep+1) % SONG_STEPS;
  }, stepSec*1000);
}

/* ---------- BGM (loops a saved song quietly in the background) ---------- */
let bgmTimer = null, bgmStep = 0, bgmPlaying = false;
function startBGM(song){
  if(!song) return;
  if(G.scene==='forest') return; // 森の奥ではBGMを流さない
  stopComposerPlayback();
  stopBGM();
  const notes = scaleNotes(song.scale);
  bgmStep = 0;
  bgmPlaying = true;
  const stepSec = 60/song.tempo/2;
  bgmTimer = setInterval(()=>{
    for(let row=0; row<notes.length; row++){
      if(song.grid[row][bgmStep]) playTone(notes[row].freq, stepSec*0.85, song.instrument, 0.11);
    }
    if(song.drumGrid){
      for(let row=0; row<DRUM_KIT.length; row++){
        if(song.drumGrid[row] && song.drumGrid[row][bgmStep]) playDrum(DRUM_KIT[row].id, 0.14);
      }
    }
    bgmStep = (bgmStep+1) % SONG_STEPS;
  }, stepSec*1000);
  renderGameShellTop();
}
function stopBGM(){
  if(bgmTimer){ clearInterval(bgmTimer); bgmTimer = null; }
  bgmPlaying = false;
  renderGameShellTop();
}

function currentBgmSongId(){
  return G.phase==='night' ? G.bgmNightSongId : G.bgmDaySongId;
}
function refreshBgmForCurrentPhase(){
  if(!bgmPlaying) return; // 何も流れていないときは何もしない
  const id = currentBgmSongId();
  const song = id ? G.songs.find(s=>s.id===id) : null;
  if(song) startBGM(song);
  else stopBGM();
}

  const notes = scaleNotes(composerScale);

  `).join('');
}
function composerDrumGridHTML(){

    <div class="composer-row">

      ${Array.from({length:SONG_STEPS}, (_,step)=>`<button class="composer-cell drum-cell${composerDrumGrid[row][step]?' active':''}" data-drow="${row}" data-dstep="${step}"></button>`).join('')}
    </div>

}

let composerEditingSong = null;
function renderComposer(existingSong){
  stopComposerPlayback();
  composerEditingSong = existingSong || null;
  composerGrid = existingSong ? existingSong.grid.map(r=>[...r]) : makeEmptyGrid();
  composerDrumGrid = existingSong && existingSong.drumGrid ? existingSong.drumGrid.map(r=>[...r]) : makeEmptyDrumGrid();
  composerTempo = existingSong ? existingSong.tempo : 100;
  composerInstrument = existingSong ? existingSong.instrument : 'sine';
  composerTitle = existingSong ? existingSong.title : '';
  composerScale = existingSong ? (existingSong.scale || 'pentatonic') : composerScale;
  renderComposerUI();
}

/* ---------- Step 4: focus allocation ---------- */
function renderFocusAllocate(){
  if(!G.craftFlow.focusAlloc) G.craftFlow.focusAlloc = {tech:0, idea:0, coop:0};
  const f = G.craftFlow.focusAlloc;
  const totalPts = f.tech+f.idea+f.coop;
  const cost = totalPts*FOCUS_POINT_COST;
  const proj = G.craftFlow.project;
  const squad = G.studio.filter(m=>G.craftFlow.squadIds.includes(m.id));
  const {techSum:baseTechRaw, ideaSum:baseIdeaRaw, coopSum:baseCoopRaw} = computeStudioStats(squad);
  const fresh = freshnessInfoFor(proj.name);
  const streakBonus = currentStreakBonusFor(proj.name);
  const baseTech = baseTechRaw + streakBonus, baseIdea = baseIdeaRaw + streakBonus, baseCoop = baseCoopRaw + streakBonus;
  const discount = fresh ? fresh.discount : 0;
  const needTech = Math.max(1, proj.tech - discount), needIdea = Math.max(1, proj.idea - discount), needCoop = Math.max(1, proj.coop - discount);

  const row = (label, key, icon, base, need)=>{
    const total = base + f[key];
    const met = total>=need;
    return `
    <div class="shop-row">
      <div class="sr-left"><span class="sr-icon">${icon}</span><div><div class="sr-name">${label} +${f[key]}</div><div class="sr-price" style="color:${met?'#2ED47A':'#FF5C5C'};font-weight:700;">${total} / 必要 ${need}${met?' ✔達成':' ← あと'+(need-total)}</div></div></div>
      <div class="btn-row" style="margin:0;gap:6px;">
        <button class="mini-btn" data-foc-minus="${key}" ${f[key]<=0?'disabled':''}>－</button>
        <button class="mini-btn buy" data-foc-plus="${key}" ${totalPts>=FOCUS_MAX||G.bells<cost+FOCUS_POINT_COST?'disabled':''}>＋</button>
      </div>
    </div>`;
  };
  const metCount = [baseTech+f.tech>=needTech, baseIdea+f.idea>=needIdea, baseCoop+f.coop>=needCoop].filter(Boolean).length;
  const starGuess = metCount===3?5 : metCount===2?4 : metCount===1?3 : 2;
  const bonusNote = [];
  if(fresh) bonusNote.push(fresh.label);
  if(streakBonus>0) bonusNote.push(`🔁連続制作ボーナス+${streakBonus}`);
  openModal(`
    <h2>💪 ④気合を入れる</h2>
    <p class="mdesc">追加の予算を投じて、今回だけ能力値を底上げできる（合計最大${FOCUS_MAX}ポイント）。使った分は制作時に支払う。現在のコスト：💰${cost}<br>
    <span style="color:#8a7a5f;">「必要」を超えている数が多いほど、作品の評価（★）が上がりやすい。赤字＝まだ足りていない能力を優先しよう。</span>${bonusNote.length?`<br><span style="color:#5C9EFF;font-weight:700;">${bonusNote.join('／')}</span>`:''}</p>
    ${row('技術に集中','tech','💻', baseTech, needTech)}

function currentStreakBonusFor(genreName){
  if(G.lastGenre === genreName) return Math.min(STREAK_BONUS_CAP, G.genreStreak||0);
  return 0;
}

function applyProductionGrowth(squad, project){
  const req = {tech:project.tech, idea:project.idea, coop:project.coop};
  const primary = Object.keys(req).reduce((a,b)=>req[a]>=req[b]?a:b);
  const statLabel = {tech:'💻技術', idea:'📝発想', coop:'🎤協調'}[primary];
  const grown = [];
  squad.forEach(m=>{
    if(!G.villagerStatBonus[m.id]) G.villagerStatBonus[m.id] = {tech:0,idea:0,coop:0};
    const b = G.villagerStatBonus[m.id];
    if(b[primary] < VILLAGER_STAT_CAP && Math.random()<0.5){
      b[primary] += 1;
      grown.push({name:m.name, statLabel});
    }
  });
  return grown;
}

function produceWork(gamble){
  const f = G.craftFlow.focusAlloc || {tech:0,idea:0,coop:0};
  const focusCost = (f.tech+f.idea+f.coop)*FOCUS_POINT_COST;
  const totalCost = 20 + focusCost;
  if(G.bells < totalCost) return;
  G.bells -= totalCost;
  const squad = G.studio.filter(m=>G.craftFlow.squadIds.includes(m.id));
  const project = G.craftFlow.project;
  const fresh = freshnessInfoFor(project.name);
  const streakBonus = currentStreakBonusFor(project.name);
  const work = generateVillageWork(project, squad, {
    style: G.craftFlow.style, focusAlloc: f, titleChoice: G.craftFlow.titleChoice,
    quirkChoice: G.craftFlow.quirkChoice, gamble, fresh, streakBonus,
  });
  work.growth = applyProductionGrowth(squad, project);
  if(G.lastGenre === work.genre) G.genreStreak = (G.genreStreak||0)+1;
  else { G.lastGenre = work.genre; G.genreStreak = 1; }
  G.productionCount += 1;
  G.genreLastProducedAt[work.genre] = G.productionCount;
  const reactions = runVillagerReactions(work, squad);
  work.reactions = reactions;
  G.workDefs[work.id] = {name:work.title, icon:work.emojiCombo.split(' ')[0], cat:'furniture'};
  addItem(work.id,1);
  G.gallery.push(work);
  G.bells += work.sales;
  logAcquire(`💰 ${work.sales}ベル（売上）を獲得`);
  G.craftFlow = null;
  renderInventoryStrip(); renderGameShellTop(); saveGame();
  renderWorkReveal(work, true);
}

function runVillagerReactions(work, squad){
  const squadIds = squad.map(m=>m.id);
  const judges = VILLAGERS_DEF.filter(v=>!squadIds.includes(v.id));
  const picked = [...judges].sort(()=>Math.random()-0.5).slice(0, Math.min(3, judges.length));
  return picked.map(v=>{
    const stars = Math.max(1, Math.min(5, work.stars + Math.floor(Math.random()*3)-1));
    G.popularity += stars;
    const bank = stars>=5?REACTIONS_HIGH:stars<=2?REACTIONS_LOW:REACTIONS_MID;
    return {name:v.name, emoji:v.emoji, stars, comment:randPick(bank)};
  });
}

/* ---------- Sleep / day cycle ---------- */
function sleep(){
  if(G.phase==='night') wakeUpToNextDay();
  else restUntilNight();
}

function wakeUpToNextDay(){
  const fs = document.getElementById('fadeScreen');
  const big = document.getElementById('fadeBig');
  const sub = document.getElementById('fadeSub');
  big.textContent = '灯りを消して……';
  sub.textContent = '';
  fs.classList.add('show');
  setTimeout(()=>{
    G.day += 1;
    G.phase = 'day';
    G.phaseElapsed = 0;
    applyPhaseLighting();
    refreshBgmForCurrentPhase();
    spawnDailies(G);
    G.scene = 'village';
    const hb = G.buildings.find(b=>b.id==='house');
    G.player.x = hb.doorC*TILE+TILE/2; G.player.y = hb.doorR*TILE+TILE/2+16;
    saveGame();
    big.textContent = `${G.day}日目の朝`;
    sub.textContent = '今日もいい一日になりますように。';
    renderGameShellTop();
    setTimeout(()=>{ fs.classList.remove('show'); }, 1200);
  }, 1100);
}

function restUntilNight(){
  const fs = document.getElementById('fadeScreen');
  const big = document.getElementById('fadeBig');
  const sub = document.getElementById('fadeSub');
  big.textContent = '少し横になって……';
  sub.textContent = '';
  fs.classList.add('show');
  setTimeout(()=>{
    G.phase = 'night';
    G.phaseElapsed = 0;
    applyPhaseLighting();
    refreshBgmForCurrentPhase();
    G.scene = 'village';
    const hb = G.buildings.find(b=>b.id==='house');
    G.player.x = hb.doorC*TILE+TILE/2; G.player.y = hb.doorR*TILE+TILE/2+16;
    saveGame();
    big.textContent = '夜になった';
    sub.textContent = '村から人の気配が消えている。';
    renderGameShellTop();
    setTimeout(()=>{ fs.classList.remove('show'); }, 1200);
  }, 1100);
}

function renderGameShellTop(){
  const top = document.querySelector('.hud-top');
  if(!top) return;
  const activeId = currentBgmSongId();
  const bgmSong = activeId ? G.songs.find(s=>s.id===activeId) : null;
  const inForest = G.scene==='forest';
  const phaseIcon = G.phase==='night' ? '🌙' : '☀️';
  const bgmLabel = inForest
    ? (bgmSong ? `🔇 ${bgmSong.title}（森では停止中）` : `${phaseIcon} BGM未設定`)
    : (bgmSong ? (bgmPlaying ? `🔊 ${bgmSong.title}` : `🔈 ${bgmSong.title}`) : `${phaseIcon} BGM未設定`);
  top.innerHTML = `
    <div class="hud-chip">📅 ${G.day}日目</div>
    <div class="hud-chip">${G.phase==='night' ? '🌙 夜' : '☀️ 昼'}</div>
    <div class="hud-chip">💰 ${G.bells} ベル</div>
    <div class="hud-chip">⭐ 人気度 ${G.popularity}</div>
    <div class="hud-chip" id="playerChip" style="cursor:pointer;">${G.avatar} ${G.playerName}／${G.villageName}</div>
    <div class="hud-chip bgm-chip" id="bgmToggleChip" style="cursor:pointer;">${bgmLabel}</div>
  `;
  const playerChip = document.getElementById('playerChip');
  if(playerChip) playerChip.onclick = renderAvatarChangeModal;
  const bgmChip = document.getElementById('bgmToggleChip');
  if(bgmChip){
    bgmChip.onclick = ()=>{
      if(inForest){ showFlavorToast('森の奥では、BGMは流れないみたい。'); return; }
      if(!activeId){ openWorkshop(); renderSongListModal(); return; }
      if(bgmPlaying){ stopBGM(); }
      else { const song = G.songs.find(s=>s.id===activeId); if(song) startBGM(song); }
    };
  }
}

function applyAvatarChange(avatar, color){
  G.avatar = avatar;
  G.playerColor = color;
  if(playerMesh && scene3d){
    const oldPos = playerMesh.position.clone();
    const oldRotY = playerMesh.rotation.y;
    scene3d.remove(playerMesh);
    playerMesh = makeCharacterMesh(color);
    const avatarFace = makeEmojiSprite(avatar, 96);
    avatarFace.position.set(0,0.5,0.05); avatarFace.scale.set(.85,.85,.85);
    playerMesh.add(avatarFace);
    playerMesh.position.copy(oldPos);
    playerMesh.rotation.y = oldRotY;
    scene3d.add(playerMesh);
  }
  saveGame();
  renderGameShellTop();
}

function makeEmojiSprite(text, size){
  size = size || 64;
  const cv = document.createElement('canvas');
  cv.width = size; cv.height = size;
  const ctx = cv.getContext('2d');
  ctx.font = (size*0.72)+'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, size/2, size/2+2);
  const tex = new THREE.CanvasTexture(cv);
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true});
  const spr = new THREE.Sprite(mat);
  spr.scale.set(0.55,0.55,0.55);
  return spr;
}

function makeSpeechBubbleSprite(text){
  const W = 320, H = 130;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.font = '22px sans-serif';
  const maxCharsPerLine = 12;
  const lines = [];
  let remaining = text;
  while(remaining.length > 0 && lines.length < 2){
    lines.push(remaining.slice(0, maxCharsPerLine));
    remaining = remaining.slice(maxCharsPerLine);
  }
  if(remaining.length>0 && lines.length){
    lines[lines.length-1] = lines[lines.length-1].slice(0,-1)+'…';
  }
  const bx=10, by=10, bw=W-20, bh=30+lines.length*30;
  const r=16;
  ctx.beginPath();
  ctx.moveTo(bx+r,by);
  ctx.arcTo(bx+bw,by,bx+bw,by+bh,r);
  ctx.arcTo(bx+bw,by+bh,bx,by+bh,r);
  ctx.arcTo(bx,by+bh,bx,by,r);
  ctx.arcTo(bx,by,bx+bw,by,r);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.94)';
  ctx.strokeStyle = 'rgba(60,55,48,0.55)';
  ctx.lineWidth = 3;
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(bx+bw/2-10, by+bh-1);
  ctx.lineTo(bx+bw/2, by+bh+16);
  ctx.lineTo(bx+bw/2+10, by+bh-1);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.94)';
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#33302B';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((ln,i)=> ctx.fillText(ln, bx+bw/2, by+26+i*30));
  const tex = new THREE.CanvasTexture(cv);
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true});
  const spr = new THREE.Sprite(mat);
  spr.scale.set(1.4, 1.4*(H/W), 1);
  return spr;
}

function makeTextSprite(text, color){
  const cv = document.createElement('canvas');
  cv.width = 240; cv.height = 60;
  const ctx = cv.getContext('2d');
  ctx.font = 'bold 30px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = color || '#4A3A2A';
  ctx.fillText(text, 120, 32);
  const tex = new THREE.CanvasTexture(cv);
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true});
  const spr = new THREE.Sprite(mat);
  spr.scale.set(1.2,0.3,1);
  return spr;
}

}
