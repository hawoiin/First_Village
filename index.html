function applyPhaseLighting(){
  const night = G.phase==='night';
  const root = document.documentElement;
  if(night){
    root.style.setProperty('--sky1', '#2B3454');
    root.style.setProperty('--sky2', '#4A5480');
    root.style.setProperty('--title-color', '#F5EFDC');
    root.style.setProperty('--title-shadow', 'rgba(20,18,45,.55)');
    root.style.setProperty('--sub-color', '#B9C6FF');
  } else {
    root.style.setProperty('--sky1', '#BEE7F5');
    root.style.setProperty('--sky2', '#E8F6E0');
    root.style.setProperty('--title-color', '#8C6230');
    root.style.setProperty('--title-shadow', '#fff');
    root.style.setProperty('--sub-color', '#7a9c68');
  }
  if(hemiLight){
    hemiLight.color.setHex(night ? 0x33395C : 0xE8F6FF);
    hemiLight.groundColor.setHex(night ? 0x1E2438 : 0x8fae6f);
    hemiLight.intensity = night ? 0.35 : 0.95;
  }
  if(dirLight){
    dirLight.color.setHex(night ? 0x9FB4FF : 0xFFF6E0);
    dirLight.intensity = night ? 0.22 : 0.85;
  }
  if(scene3d) scene3d.background = new THREE.Color(night ? 0x232A45 : 0xffffff);
  if(playerLampLight) playerLampLight.intensity = night ? 0.9 : 0;
}

function buildForestGroup(){
  if(!forestGroup) return;
  while(forestGroup.children.length) forestGroup.remove(forestGroup.children[0]);
  forestTreeMeshes = []; forestSparkleMeshes = [];
  if(!G.forest) return;
  const isDepths = G.forest.zone==='depths';

  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const t = G.forest.map[r][c];
      const h = 0.18;
      const pathColor = isDepths ? 0x6E5C86 : 0xC7BFA8;
      const floorColor = isDepths ? 0x342A44 : 0x5C6455;
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.98,h,0.98),
        new THREE.MeshStandardMaterial({color: t===1?pathColor:floorColor, roughness:.95}));
      const pos = tileCenterWorld(c,r);
      mesh.position.set(pos.x, h/2-0.09, pos.z);
      mesh.receiveShadow = true;
      forestGroup.add(mesh);
    }
  }
  if(isDepths){
    const doorPos = tileCenterWorld(DEPTHS_DOOR_TILE.c, DEPTHS_DOOR_TILE.r);
    const doorSpr = makeEmojiSprite('🌲', 56); doorSpr.position.set(doorPos.x,0.35,doorPos.z); doorSpr.scale.set(.42,.42,.42);
    forestGroup.add(doorSpr);
  } else {
    const exitPos = tileCenterWorld(FOREST_EXIT_TILE.c, FOREST_EXIT_TILE.r);
    const exitSpr = makeEmojiSprite('🏘️', 56); exitSpr.position.set(exitPos.x,0.35,exitPos.z); exitSpr.scale.set(.42,.42,.42);
    forestGroup.add(exitSpr);
  }

  const makeTree = (tr, big)=>{
    const pos = tileCenterWorld(tr.c, tr.r);
    const g = new THREE.Group();
    const isEntrance = big && tr.deepEntrance;
    const scaleMul = (big ? 1.6 : 1) * (isEntrance ? 1.15 : 1);
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.07*scaleMul,0.09*scaleMul,0.32*scaleMul,6),
      new THREE.MeshStandardMaterial({
        color: isEntrance ? 0x8C6FE0 : big?0xD9D3C2:0x6B6455,
        emissive: isEntrance ? 0x5A3FC0 : 0x000000,
        emissiveIntensity: isEntrance ? 0.7 : 0,
        roughness:.9,
      }));
    trunk.position.y = 0.16*scaleMul; trunk.castShadow=true;
    g.add(trunk);
    const canopy = new THREE.Mesh(new THREE.IcosahedronGeometry(0.30*scaleMul,0),
      new THREE.MeshStandardMaterial({
        color: isEntrance ? 0xF3EBFF : big?0xEDE9DD:0x5E6653,
        emissive: isEntrance ? 0xB79CFF : 0x000000,
        emissiveIntensity: isEntrance ? 0.9 : 0,
        roughness:.85, flatShading:true,
      }));
    canopy.position.y = 0.5*scaleMul; canopy.castShadow = true;
    g.add(canopy);
    if(isEntrance){
      // 足元に光る輪をつくって、遠くからでも分かるようにする
      const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.03,20),
        new THREE.MeshStandardMaterial({color:0xD8C6FF, emissive:0x9B7CFF, emissiveIntensity:0.8, roughness:.6, transparent:true, opacity:.55}));
      ring.position.y = 0.02;
      g.add(ring);
    } else if(big){
      const glow = makeEmojiSprite('✨', 40);
      glow.position.y = 0.5*scaleMul+0.3; glow.scale.set(.3,.3,.3);
      g.add(glow);
    }
    g.position.set(pos.x, 0, pos.z);
    g.rotation.y = Math.random()*Math.PI*2;
    forestGroup.add(g);
    return g;
  };
  G.forest.trees.forEach(tr=>forestTreeMeshes.push(makeTree(tr,false)));
  G.forest.ancientTrees.forEach(tr=>forestTreeMeshes.push(makeTree(tr,true)));

  if(isDepths && G.forest.shrine){
    const sh = G.forest.shrine;
    const pos = tileCenterWorld(sh.c, sh.r);
    const g = new THREE.Group();
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.26,0.12,8),
      new THREE.MeshStandardMaterial({color:0xEDE9DD, roughness:.8}));
    base.position.y = 0.06; base.castShadow = true;
    g.add(base);
    const glowIcon = makeEmojiSprite(sh.done?'🕯️':'✨', 48);
    glowIcon.position.y = 0.42; glowIcon.scale.set(.36,.36,.36);
    g.add(glowIcon);
    g.position.set(pos.x, 0, pos.z);
    forestGroup.add(g);
  }

  forestSparkleMeshes = G.forest.sparkles.map(sp=>{
    const spr = makeEmojiSprite('✨', 56);
    spr.scale.set(.42,.42,.42);
    const pos = tileCenterWorld(sp.c, sp.r);
    spr.position.set(pos.x, 0.35, pos.z);
    forestGroup.add(spr);
    return spr;
  });
}

      const h = isWall? 0.9 : 0.16;
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.98,h,0.98),
        new THREE.MeshStandardMaterial({color: isWall?0xC9A46B:0xF3E3C2, roughness:.9}));
      mesh.position.set(pos.x, h/2-0.09, pos.z);
      mesh.receiveShadow = true;
      if(isWall) mesh.castShadow = true;
      houseGroup.add(mesh);
      if(!isWall){ mesh.userData = {c,r}; floorTileMeshes.push(mesh); }
    }
  }
  const doorC = Math.floor(COLS/2), doorR = ROWS-2;
  const doorPos = tileCenterWorld(doorC, doorR);
  const doorSpr = makeEmojiSprite('🚪',56); doorSpr.position.set(doorPos.x,0.35,doorPos.z); doorSpr.scale.set(.42,.42,.42);
  houseGroup.add(doorSpr);
  const bedPos = tileCenterWorld(1,1);
  const bedSpr = makeEmojiSprite('🛏️',64); bedSpr.position.set(bedPos.x,0.35,bedPos.z); bedSpr.scale.set(.5,.5,.5);
  houseGroup.add(bedSpr);

  rebuildFurnitureMeshes();
}

function rebuildFurnitureMeshes(){
  furnitureMeshes.forEach(m=>houseGroup.remove(m));
  furnitureMeshes = G.houseFurniture.map(f=>{
    const g = new THREE.Group();
    const pos = tileCenterWorld(f.c, f.r);
    const isWork = f.itemId.startsWith('work_');
    const box = new THREE.Mesh(new THREE.BoxGeometry(0.7,0.28,0.7),
      new THREE.MeshStandardMaterial({color: isWork?0xFFE8B0:0xffffff, roughness:.8}));
    box.position.y = 0.14; box.castShadow = true; box.receiveShadow = true;
    g.add(box);
    const def = getItemDef(f.itemId);
    const icon = makeEmojiSprite(def?def.icon:'📦', 56);
    icon.position.y = 0.5; icon.scale.set(.42,.42,.42);
    g.add(icon);
    if(isWork && def){
      const label = makeTextSprite(def.name, '#4A3A2A');
      label.position.y = 0.82; label.scale.set(0.9,0.24,1);
      g.add(label);
    }
    g.position.set(pos.x, 0, pos.z);
    houseGroup.add(g);
    return g;
  });
}

function updateSceneVisibility(){
  if(!villageGroup) return;
  villageGroup.visible = (G.scene==='village');
  houseGroup.visible = (G.scene==='house');
  forestGroup.visible = (G.scene==='forest');
  activeCamera = G.scene==='village' ? cameraVillage : G.scene==='forest' ? cameraForest : cameraHouse;
}

function wireRaycastClick(){
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  renderer3d.domElement.addEventListener('click', (e)=>{
    if(G.scene!=='house' || (!placementItem && !movingFurniture)) return;
    const rect = renderer3d.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
    mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(mouse, activeCamera);
    const hits = raycaster.intersectObjects(floorTileMeshes);
    if(!hits.length) return;
    const {c,r} = hits[0].object.userData;
    if(!inHouseFloor(c,r)) return;
    if(G.houseFurniture.some(f=>f.c===c&&f.r===r)) return;
    if(movingFurniture){
      movingFurniture.c = c; movingFurniture.r = r;
      movingFurniture = null;
      saveGame();
      rebuildFurnitureMeshes();
      return;
    }
    if((G.inventory[placementItem]||0)<=0){ placementItem=null; return; }
    G.inventory[placementItem]-=1;
    G.houseFurniture.push({itemId:placementItem, c, r});
    if(!G.placedFurnitureTypes.includes(placementItem)){
      G.placedFurnitureTypes.push(placementItem);
      G.popularity += 1;
      renderGameShellTop();
      showFlavorToast(`⭐ 新しい家具で人気度+1（${getItemDef(placementItem).name}）`);
    }
    placementItem = null;
    renderInventoryStrip(); saveGame();
    rebuildFurnitureMeshes();
  });
}

function addParticle3D(text, worldX, worldZ){
  if(!scene3d) return;
  const spr = makeTextSprite(text, '#4A3A2A');
  spr.scale.set(0.7,0.22,1);
  spr.position.set(worldX, 0.6, worldZ);
  scene3d.add(spr);
  particleSprites.push({spr, life:1.1});
}

function syncThree(){
  if(!renderer3d) return;

  if(playerMesh){
    const wp = toWorld(G.player.x, G.player.y);
    playerMesh.position.set(wp.x, 0, wp.z);
    if(playerLampLight) playerLampLight.position.set(wp.x, 0.6, wp.z);
  }
  G.villagers.forEach((v,i)=>{
    const mesh = villagerMeshes[i];
    if(!mesh) return;
    mesh.visible = G.phase!=='night';
    if(G.phase==='night') return;
    const wp = toWorld(v.x, v.y);
    mesh.position.set(wp.x, 0, wp.z);
  });
  if(bugMeshes.length !== G.bugs.length) rebuildBugMeshes();
  G.bugs.forEach((bug,i)=>{
    const spr = bugMeshes[i];
    if(!spr) return;
    const wp = toWorld(bug.x, bug.y);
    spr.position.set(wp.x, 0.32 + Math.sin(performance.now()/300+i)*0.05, wp.z);
  });
  if(sparkleMeshes.length !== G.sparkles.length) rebuildSparkleMeshes();
  sparkleMeshes.forEach((spr,i)=>{
    spr.position.y = 0.32 + Math.sin(performance.now()/260+i)*0.06;
  });
  if(G.scene==='forest' && G.forest && forestSparkleMeshes.length !== G.forest.sparkles.length){
    buildForestGroup();
  }
  forestSparkleMeshes.forEach((spr,i)=>{
    spr.position.y = 0.35 + Math.sin(performance.now()/260+i)*0.06;
  });
  if(G.scene==='house' && furnitureMeshes.length !== G.houseFurniture.length) rebuildFurnitureMeshes();

  particleSprites = particleSprites.filter(p=>{
    p.life -= 1/60;
    p.spr.position.y += 0.012;
    p.spr.material.opacity = Math.max(0, p.life);
    if(p.life<=0){ scene3d.remove(p.spr); return false; }
    return true;
  });
  updatePaleEncounters(1/60);
  updateForestVillagerSightings(1/60);

  updateSceneVisibility();
  updateCameraFollow();
  renderer3d.render(scene3d, activeCamera);
}

function updateCameraFollow(){
  if(!activeCamera) return;
  const wp = toWorld(G.player.x, G.player.y);
  const offset = G.scene==='house' ? {y:4.4, z:3.4} : G.scene==='forest' ? {y:5.6, z:5.0} : {y:6.4, z:5.4};
  const targetX = wp.x, targetY = offset.y, targetZ = wp.z + offset.z;
  const cp = activeCamera.position;
  cp.x += (targetX - cp.x)*0.08;
  cp.y += (targetY - cp.y)*0.08;
  cp.z += (targetZ - cp.z)*0.08;
  activeCamera.lookAt(wp.x, 0.3, wp.z);
}

function draw(){
  syncThree();
}


/* ============================================================
   HOUSE FURNITURE PLACEMENT ENTRY (from inventory strip)
   ============================================================ */
document.addEventListener('click', (e)=>{
  const item = e.target.closest('.inv-item');
  if(!item || !G) return;
  const idx = Array.from(item.parentNode.children).indexOf(item);
  const entries = Object.entries(G.inventory).filter(([k,v])=>v>0);
  const [id] = entries[idx] || [];
  if(!id) return;
  if(id==='note_page'){
    openModal(`
      <h2>📄 白いノートの切れ端</h2>
      <p class="mdesc" style="font-size:13.5px;line-height:1.9;color:#4b4740;">${randPick(NOTE_FRAGMENTS)}</p>
      <div class="btn-row" style="margin-top:10px;"><button class="mini-btn" id="closeNoteRead">とじる</button></div>
    `);
    document.getElementById('closeNoteRead').onclick = closeModal;
    return;
  }
  if(id==='odd_item'){
    openModal(`
      <h2>🎐 誰かの忘れ物</h2>
      <p class="mdesc" style="font-size:13.5px;line-height:1.9;color:#4b4740;">${randPick(ODD_OBJECT_LINES)}</p>
      <div class="btn-row" style="margin-top:10px;"><button class="mini-btn" id="closeOddRead">とじる</button></div>
    `);
    document.getElementById('closeOddRead').onclick = closeModal;
    return;
  }
  if(G.scene!=='house') return;
  if(getItemDef(id) && getItemDef(id).cat==='furniture'){
    placementItem = id;
    movingFurniture = null;
  }
});

/* ============================================================
   KEYBOARD
   ============================================================ */
window.addEventListener('keydown', (e)=>{
  keys[e.code] = true;
  if(e.code==='Backquote'){
    const tag = document.activeElement && document.activeElement.tagName;
    if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT') return;
    const p = document.getElementById('devPanel');
    if(p) p.style.display = (p.style.display==='none' || !p.style.display) ? 'block' : 'none';
    return;
  }
  if(e.code==='Space' || e.code==='KeyE'){
    const tag = document.activeElement && document.activeElement.tagName;
    if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT') return; // 入力中はキーを奪わない
    e.preventDefault();
    const modalOpen = document.getElementById('modalOverlay').classList.contains('show');
    if(!modalOpen){ doAction(); return; }
    const closeBtn = document.getElementById('closeDialogue');
    if(closeBtn) closeBtn.click();
  }
});
window.addEventListener('keyup', (e)=>{ keys[e.code] = false; });

/* ============================================================
   DEV PANEL（開発者モード：森の奥イベントを任意発火）
   ============================================================ */
function wireDevPanel(){
  const need = (fn)=>()=>{ if(!G){ return; } fn(); };
  document.getElementById('devToNight').onclick = need(()=>{
    G.phase='night'; G.phaseElapsed=0; applyPhaseLighting(); refreshBgmForCurrentPhase(); renderGameShellTop();
  });
  document.getElementById('devToDay').onclick = need(()=>{
    G.phase='day'; G.phaseElapsed=0; applyPhaseLighting(); refreshBgmForCurrentPhase(); renderGameShellTop();
  });
  document.getElementById('devToForest').onclick = need(()=>{
    if(G.scene!=='forest') enterForest();
  });
  document.getElementById('devToVillage').onclick = need(()=>{
    if(G.scene==='forest') exitForest();
  });
  document.getElementById('devEvFigure').onclick = need(spawnFigureEncounter);
  document.getElementById('devEvSound').onclick = need(spawnSoundEvent);
  document.getElementById('devEvObject').onclick = need(spawnFoundObjectEvent);
  document.getElementById('devEvDisorient').onclick = need(spawnDisorientEvent);
  document.getElementById('devEvFlicker').onclick = need(spawnLightFlickerEvent);
  document.getElementById('devEvVillager').onclick = need(spawnVillagerSightingEvent);
}
wireDevPanel();

/* ============================================================
   INIT
   ============================================================ */
renderStart();
</script>
